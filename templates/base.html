<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Crypto SaaS — Trading Intelligence</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">

    <nav class="navbar">
        <div class="logo">AI <span>CRYPTO</span> SAAS</div>
        
        {% if user %}
        <div class="nav-links">
            <a href="/activity" class="nav-item">Monitor</a>
            <a href="/dashboard" class="nav-item">Settings</a>
        </div>
        <div class="user-menu">
            <span class="user-name">Welcome, <strong>{{ user.username }}</strong></span>
            <a href="/logout" class="btn btn-outline btn-sm">Sign Out</a>
        </div>
        {% endif %}
    </nav>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 AI Crypto Bot Grid. Operational Intelligence Protocol.</p>
    </footer>

</body>
</html>
