{% extends "base.html" %}

{% block content %}
<div class="glass-panel login-card">
    <h1 class="glow-text">Welcome Back</h1>
    <p class="subtitle">Enter the next generation of algorithmic trading.</p>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login" class="form">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="john_doe" required class="input-field">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required class="input-field">
        </div>
        
        <div class="button-group">
            <button type="submit" name="action" value="login" class="btn btn-primary">Sign In</button>
            <button type="submit" name="action" value="register" class="btn btn-secondary">Create Account</button>
        </div>
    </form>
</div>
{% endblock %}
