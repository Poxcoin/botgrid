<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KADO Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:    var(--tg-theme-bg-color, #0a0a0a);
    --bg2:   var(--tg-theme-secondary-bg-color, #111111);
    --fg:    var(--tg-theme-text-color, #f0f2f5);
    --muted: var(--tg-theme-hint-color, #4a5568);
    --muted2: #8b95a8;
    --border: rgba(255,255,255,0.08);
    --border-hi: rgba(255,255,255,0.14);
    --green: #00d4aa;
    --red:   #ff4d6d;
    --green-dim: rgba(0,212,170,0.12);
    --red-dim:   rgba(255,77,109,0.12);
    --font:  -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    --mono:  'JetBrains Mono', 'SF Mono', 'Courier New', monospace;
  }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding:
      env(safe-area-inset-top, 0)
      env(safe-area-inset-right, 0)
      env(safe-area-inset-bottom, 0)
      env(safe-area-inset-left, 0);
  }
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  /* ── Header ────────────────────────────────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: #050505;
  }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--fg);
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted2);
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .dot.on  { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.off { background: var(--red);   box-shadow: 0 0 8px var(--red); }

  /* ── Content ───────────────────────────────────────────────────── */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ── Section wrapper ───────────────────────────────────────────── */
  .section { display: flex; flex-direction: column; gap: 0; }
  .section-label {
    font-size: 9px;
    font-family: var(--mono);
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 0 0 8px 1px;
  }

  /* ── Card ──────────────────────────────────────────────────────── */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 0;
  }

  /* ── Balance ───────────────────────────────────────────────────── */
  .balance-card {
    padding: 20px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .balance-val {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--fg);
  }
  .balance-currency {
    font-size: 14px;
    font-weight: 400;
    color: var(--muted2);
    margin-left: 4px;
    letter-spacing: 0;
  }
  .balance-upnl {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    padding: 4px 8px;
    border: 1px solid;
    line-height: 1;
  }
  .upnl-pos { color: var(--green); border-color: rgba(0,212,170,0.25); background: var(--green-dim); }
  .upnl-neg { color: var(--red);   border-color: rgba(255,77,109,0.25); background: var(--red-dim); }
  .upnl-zero { color: var(--muted2); border-color: var(--border); background: transparent; }

  /* ── Positions ─────────────────────────────────────────────────── */
  .pos-item {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .pos-item:last-child { border-bottom: none; }
  .pos-left { display: flex; flex-direction: column; gap: 4px; }
  .pos-symbol {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--fg);
  }
  .pos-meta {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .pos-side {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 2px 6px;
    border: 1px solid;
  }
  .pos-side.long  { color: var(--green); border-color: rgba(0,212,170,0.3);  background: var(--green-dim); }
  .pos-side.short { color: var(--red);   border-color: rgba(255,77,109,0.3); background: var(--red-dim); }
  .pos-leverage {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted2);
    letter-spacing: 0.08em;
  }
  .pos-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .pos-pnl {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .pos-pnl.long  { color: var(--green); }
  .pos-pnl.short { color: var(--red); }
  .pos-entry {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* ── Signals ───────────────────────────────────────────────────── */
  .sig-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .sig-item:last-child { border-bottom: none; }
  .sig-badge {
    font-family: var(--mono);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.14em;
    padding: 3px 7px;
    border: 1px solid;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .badge-long  { color: var(--green); border-color: rgba(0,212,170,0.3);  background: var(--green-dim); }
  .badge-short { color: var(--red);   border-color: rgba(255,77,109,0.3); background: var(--red-dim); }
  .sig-coin {
    font-size: 13px;
    font-weight: 600;
    flex: 1;
    color: var(--fg);
  }
  .sig-time {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }
  .sig-res {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 2px 6px;
    border: 1px solid;
    flex-shrink: 0;
    text-transform: uppercase;
  }
  .res-win  { color: var(--green); border-color: rgba(0,212,170,0.25);  background: var(--green-dim); }
  .res-loss { color: var(--red);   border-color: rgba(255,77,109,0.25); background: var(--red-dim); }

  /* ── Empty ─────────────────────────────────────────────────────── */
  .empty {
    text-align: center;
    padding: 24px 16px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }

  /* ── Footer / Button ───────────────────────────────────────────── */
  .footer {
    padding: 16px 20px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: #050505;
  }
  #pause-btn {
    width: 100%;
    padding: 14px 20px;
    border: 1px solid;
    border-radius: 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  #pause-btn:active { opacity: 0.7; }
  #pause-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-running {
    background: rgba(255, 77, 109, 0.08);
    color: var(--red);
    border-color: rgba(255, 77, 109, 0.3) !important;
  }
  .btn-running:hover:not(:disabled) {
    background: rgba(255, 77, 109, 0.14);
  }
  .btn-paused {
    background: rgba(0, 212, 170, 0.08);
    color: var(--green);
    border-color: rgba(0, 212, 170, 0.3) !important;
  }
  .btn-paused:hover:not(:disabled) {
    background: rgba(0, 212, 170, 0.14);
  }

  /* ── Loading / Error states ────────────────────────────────────── */
  .center {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    flex-direction: column;
    gap: 16px;
    padding: 40px 24px;
  }
  .spinner {
    width: 24px;
    height: 24px;
    border: 1.5px solid var(--border-hi);
    border-top-color: var(--fg);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-msg {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Error box */
  .err-box {
    border: 1px solid var(--border-hi);
    background: var(--bg2);
    padding: 20px 24px;
    max-width: 300px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
  }
  .err-icon {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--red);
    border: 1px solid rgba(255,77,109,0.25);
    background: var(--red-dim);
    padding: 4px 10px;
  }
  .err-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--fg);
    line-height: 1.4;
  }
  .err-msg {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted2);
    line-height: 1.6;
    letter-spacing: 0.02em;
  }
  .err-action {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    width: 100%;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app">
  <div class="center" id="loading-screen">
    <div class="spinner"></div>
    <div id="status-msg" class="status-msg">Initializing…</div>
  </div>
</div>

<script>
'use strict';
function setStatus(msg) {
  const el = document.getElementById('status-msg');
  if (el) el.textContent = msg;
}

// Telegram injects window.Telegram.WebApp natively before page load.
// The external script is a polyfill — we don't wait for it.
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let _token  = null;
let _paused = false;

// ── helpers ────────────────────────────────────────────────────────────────
function fmt(n)  { return Number(n || 0).toFixed(2); }
function sign(n) { return n >= 0 ? '+' : '-'; }

function timeAgo(ts) {
  if (!ts) return '';
  const d    = new Date(typeof ts === 'number' ? ts : ts);
  const diff = Math.floor((Date.now() - d) / 60000);
  if (diff < 1)    return 'just now';
  if (diff < 60)   return diff + 'm ago';
  if (diff < 1440) return Math.floor(diff / 60) + 'h ago';
  return Math.floor(diff / 1440) + 'd ago';
}

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}

// ── build DOM from safe data ────────────────────────────────────────────────
function buildHeader(paused) {
  const h = el('div', 'header');
  h.appendChild(el('div', 'logo', 'KADO'));
  const right = el('div', 'header-right');
  right.appendChild(el('span', 'status-label', paused ? 'Paused' : 'Live'));
  right.appendChild(el('div', 'dot ' + (paused ? 'off' : 'on')));
  h.appendChild(right);
  return h;
}

function buildBalance(balance) {
  const upnl  = Number(balance?.unrealized_pnl || 0);
  const wrap  = el('div', 'section');
  wrap.appendChild(el('div', 'section-label', 'USDT Balance'));
  const card  = el('div', 'card balance-card');

  const left = el('div');
  const valRow = el('div');
  valRow.style.display = 'flex';
  valRow.style.alignItems = 'baseline';
  const valEl = el('span', 'balance-val', '$' + fmt(balance?.usdt_wallet));
  valRow.appendChild(valEl);
  valRow.appendChild(el('span', 'balance-currency', 'USDT'));
  left.appendChild(valRow);
  card.appendChild(left);

  const upnlClass = upnl > 0 ? 'balance-upnl upnl-pos' : upnl < 0 ? 'balance-upnl upnl-neg' : 'balance-upnl upnl-zero';
  const upnlEl = el('div', upnlClass, (upnl >= 0 ? '+' : '') + '$' + fmt(upnl));
  card.appendChild(upnlEl);
  wrap.appendChild(card);
  return wrap;
}

function buildPositions(positions) {
  const wrap = el('div', 'section');
  wrap.appendChild(el('div', 'section-label', 'Open Positions (' + (positions || []).length + ')'));
  const card = el('div', 'card');
  if (!(positions || []).length) {
    card.appendChild(el('div', 'empty', 'No open positions'));
  } else {
    positions.forEach(p => {
      const pnl   = Number(p.unrealized_pnl || 0);
      const row   = el('div', 'pos-item');

      const left  = el('div', 'pos-left');
      left.appendChild(el('div', 'pos-symbol', p.symbol));
      const meta  = el('div', 'pos-meta');
      meta.appendChild(el('span', 'pos-side ' + (p.side === 'LONG' ? 'long' : 'short'), p.side));
      meta.appendChild(el('span', 'pos-leverage', p.leverage + '\xD7'));
      left.appendChild(meta);
      row.appendChild(left);

      const right = el('div', 'pos-right');
      right.appendChild(el('div', 'pos-pnl ' + (pnl >= 0 ? 'long' : 'short'),
                           (pnl >= 0 ? '+' : '') + '$' + fmt(pnl)));
      right.appendChild(el('div', 'pos-entry', '@ ' + fmt(p.entry_price)));
      row.appendChild(right);
      card.appendChild(row);
    });
  }
  wrap.appendChild(card);
  return wrap;
}

function buildSignals(signals) {
  const wrap = el('div', 'section');
  wrap.appendChild(el('div', 'section-label', 'Recent Signals'));
  const card = el('div', 'card');
  const list = (signals || []).slice(0, 8);
  if (!list.length) {
    card.appendChild(el('div', 'empty', 'No recent signals'));
  } else {
    list.forEach(s => {
      const row   = el('div', 'sig-item');
      const badge = el('span', 'sig-badge ' + (s.action === 'LONG' ? 'badge-long' : 'badge-short'), s.action);
      row.appendChild(badge);
      row.appendChild(el('span', 'sig-coin', s.coin));
      if (s.result) {
        const res = el('span', 'sig-res ' + (s.result === 'WIN' ? 'res-win' : 'res-loss'), s.result);
        row.appendChild(res);
      }
      row.appendChild(el('span', 'sig-time', timeAgo(s.timestamp)));
      card.appendChild(row);
    });
  }
  wrap.appendChild(card);
  return wrap;
}

function buildFooter(paused) {
  const footer = el('div', 'footer');
  const btn    = document.createElement('button');
  btn.id        = 'pause-btn';
  btn.className = paused ? 'btn-paused' : 'btn-running';
  btn.textContent = paused ? '▶ Resume Bot' : '⏸ Pause Bot';
  btn.addEventListener('click', togglePause);
  footer.appendChild(btn);
  return footer;
}

// ── render ─────────────────────────────────────────────────────────────────
function render(data) {
  const { balance, positions, signals, paused } = data;
  _paused = paused;

  const app = document.getElementById('app');
  app.textContent = '';                        // clear safely

  app.appendChild(buildHeader(paused));

  const content = el('div', 'content');
  content.appendChild(buildBalance(balance));
  content.appendChild(buildPositions(positions));
  content.appendChild(buildSignals(signals));
  app.appendChild(content);

  app.appendChild(buildFooter(paused));
}

function showError(msg) {
  const app  = document.getElementById('app');
  app.textContent = '';

  // Classify error type for better messaging
  const isBybitKeys = msg && (
    msg.toLowerCase().includes('bybit') ||
    msg.toLowerCase().includes('api key') ||
    msg.toLowerCase().includes('not configured') ||
    msg.toLowerCase().includes('keys')
  );
  const isAuth = msg && (
    msg.toLowerCase().includes('auth') ||
    msg.toLowerCase().includes('401') ||
    msg.toLowerCase().includes('403') ||
    msg.toLowerCase().includes('token') ||
    msg.toLowerCase().includes('unauthorized')
  );
  const isTimeout = msg && (
    msg.toLowerCase().includes('timeout') ||
    msg.toLowerCase().includes('abort') ||
    msg.toLowerCase().includes('timed out')
  );

  let title, detail, action;
  if (isBybitKeys) {
    title  = 'API keys not set';
    detail = 'Connect your Bybit API keys in Settings to enable the dashboard.';
    action = 'Open Settings → API Keys';
  } else if (isAuth) {
    title  = 'Authentication failed';
    detail = 'Open this app through the official Telegram bot to authenticate.';
    action = null;
  } else if (isTimeout) {
    title  = 'Connection timeout';
    detail = 'The server took too long to respond. Check your connection and try again.';
    action = 'Pull down to refresh';
  } else {
    title  = 'Something went wrong';
    detail = msg || 'An unexpected error occurred. Please try again.';
    action = null;
  }

  const wrap = el('div', 'center');
  const box  = el('div', 'err-box');
  box.appendChild(el('div', 'err-icon', 'Error'));
  box.appendChild(el('div', 'err-title', title));
  box.appendChild(el('div', 'err-msg', detail));
  if (action) {
    box.appendChild(el('div', 'err-action', action));
  }
  wrap.appendChild(box);
  app.appendChild(wrap);
}

// ── pause toggle ───────────────────────────────────────────────────────────
async function togglePause() {
  if (!_token) return;
  const btn = document.getElementById('pause-btn');
  if (btn) btn.disabled = true;
  try {
    const res = await fetch('/api/webapp/pause', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', 'X-Webapp-Token': _token },
      body:    JSON.stringify({ pause: !_paused }),
    });
    if (res.ok) {
      _paused = !_paused;
      if (btn) {
        btn.className   = _paused ? 'btn-paused'  : 'btn-running';
        btn.textContent = _paused ? '▶ Resume Bot' : '⏸ Pause Bot';
      }
      const dot = document.querySelector('.dot');
      if (dot) { dot.className = 'dot ' + (_paused ? 'off' : 'on'); }
      const statusLbl = document.querySelector('.status-label');
      if (statusLbl) { statusLbl.textContent = _paused ? 'Paused' : 'Live'; }
    }
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ── init ───────────────────────────────────────────────────────────────────
async function init() {
  const initData = tg?.initData || '';
  setStatus('Connecting to server…');
  try {
    const res = await fetch('/api/webapp/init', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ init_data: initData }),
      signal:  AbortSignal.timeout(12000),
    });
    setStatus('Verifying…');
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showError(err.detail || 'Auth failed (' + res.status + ')');
      return;
    }
    const data = await res.json();
    _token = data.token;
    render(data);
  } catch (e) {
    showError(e?.message || String(e));
  }
}

init();
</script>
</body>
</html>
