<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>KADO — Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;color:#e8e8e8;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    overflow:hidden}
  .wrap{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:40px 24px;text-align:center}
  .logo{font-size:48px;font-weight:900;letter-spacing:-0.04em;color:#fff;margin-bottom:8px}
  .tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.25em;
    text-transform:uppercase;color:#666;margin-bottom:48px}
  .spinner{width:48px;height:48px;border:2px solid rgba(0,184,148,0.15);
    border-top-color:#00b894;border-radius:50%;animation:spin 0.8s linear infinite;
    margin-bottom:24px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status{font-size:13px;color:#999;font-weight:500;margin-bottom:8px}
  .detail{font-family:'JetBrains Mono',monospace;font-size:10px;color:#555;
    letter-spacing:0.05em}
  .error{color:#f6465d;max-width:320px}
  .btn{margin-top:24px;background:#00b894;color:#000;border:none;padding:14px 32px;
    font-weight:700;font-size:13px;letter-spacing:0.15em;text-transform:uppercase;
    border-radius:0;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="logo">KADO</div>
  <div class="tag">Telegram Dashboard</div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status">Authenticating via Telegram…</div>
  <div class="detail" id="detail"></div>
</div>

<script>
(async function(){
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const $status = document.getElementById('status');
  const $detail = document.getElementById('detail');
  const $spinner = document.getElementById('spinner');
  const $wrap = document.getElementById('wrap');

  function fail(msg, sub){
    $spinner.style.display = 'none';
    $status.className = 'status error';
    $status.textContent = msg;
    $detail.textContent = sub || '';
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = 'Open in browser';
    btn.onclick = ()=> {
      const url = 'https://kadoclub.net/auth';
      if (tg && tg.openLink) tg.openLink(url, {try_instant_view:false});
      else location.href = url;
    };
    $wrap.appendChild(btn);
  }

  // If user already has a token (returning visit), just go.
  const existingToken = localStorage.getItem('kado_token');
  const existingUser  = localStorage.getItem('kado_user');
  if (existingToken && existingUser) {
    $status.textContent = 'Loading dashboard…';
    location.replace('/account');
    return;
  }

  // Need to authenticate via Telegram initData
  if (!tg || !tg.initData) {
    fail('Open this page from Telegram', 'No Telegram session detected');
    return;
  }

  try {
    const resp = await fetch('/api/webapp/init', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ init_data: tg.initData }),
      signal: AbortSignal.timeout(12000),
    });
    if (!resp.ok) {
      fail('Login failed', 'Server returned ' + resp.status);
      return;
    }
    const data = await resp.json();
    if (!data.jwt || !data.full_user) {
      fail('Account not linked', 'Open Telegram bot first → /start');
      return;
    }
    localStorage.setItem('kado_token', data.jwt);
    localStorage.setItem('kado_user', JSON.stringify(data.full_user));
    $status.textContent = 'Welcome, ' + (data.full_user.username || data.full_user.email) + '!';
    $detail.textContent = 'Loading dashboard…';
    setTimeout(()=> location.replace('/account'), 250);
  } catch (e) {
    fail('Network error', String(e).substring(0, 80));
  }
})();
</script>
</body>
</html>
