<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    background: #050505;
    color: #f0f2f5;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    overflow: hidden;
    position: relative;
  }
  /* Subtle grid backdrop */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at 30% 50%, #000 35%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 30% 50%, #000 35%, transparent 75%);
  }
  .glow {
    position: absolute;
    width: 720px; height: 720px;
    right: -180px; top: -120px;
    background: radial-gradient(circle, rgba(0,212,170,0.18), transparent 60%);
    filter: blur(40px);
  }
  .container {
    position: relative; z-index: 2;
    height: 100%;
    padding: 80px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; align-items: center; gap: 14px; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #00d4aa; box-shadow: 0 0 12px rgba(0,212,170,0.7);
  }
  .eyebrow {
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: #8b95a8;
  }
  h1 {
    font-size: 184px; font-weight: 900;
    letter-spacing: -0.06em; line-height: 0.86;
    margin: 0; color: #f0f2f5;
  }
  .tag {
    font-size: 32px; font-weight: 600;
    letter-spacing: -0.02em; line-height: 1.18;
    margin-top: 22px; max-width: 880px;
    color: #cbd5e1;
  }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 18px;
    border: 1px solid rgba(0,212,170,0.4);
    background: rgba(0,212,170,0.08);
    border-radius: 100px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #00d4aa; font-weight: 700;
  }
  .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #4a5568;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="container">
    <div class="top">
      <span class="dot"></span>
      <span class="eyebrow">AI · Signal · Intelligence</span>
    </div>
    <div>
      <h1>KADO</h1>
      <p class="tag">Automate crypto trading on Bybit. Pay 20% only on profits. You keep custody.</p>
    </div>
    <div class="bottom">
      <div class="pill"><span>20% · Performance only</span></div>
      <div class="url">kadoclub.net</div>
    </div>
  </div>
</body>
</html>
