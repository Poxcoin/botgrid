<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KADO</title>
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<style>
:root {
  --bg-base:     #050505;
  --bg-surface:  #0a0a0a;
  --bg-elevated: #111111;
  --text-primary:   #f0f2f5;
  --text-secondary: #8b95a8;
  --text-muted:     #4a5568;
  --border:    rgba(255,255,255,0.06);
  --border-hi: rgba(255,255,255,0.1);
  --green:     #00d4aa;
  --green-dim: rgba(0,212,170,0.12);
  --red:       #ff4d6d;
  --red-dim:   rgba(255,77,109,0.12);
  --mono: 'SF Mono','Courier New',monospace;
  --sans: -apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg-base);color:var(--text-primary);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
#app{display:flex;flex-direction:column;min-height:100vh}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg-base);position:sticky;top:0;z-index:10}
.logo{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.3em;text-transform:uppercase}
.hdr-r{display:flex;align-items:center;gap:8px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.psd{background:var(--red);box-shadow:0 0 6px var(--red)}
.lbl{font-family:var(--mono);font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted)}

/* tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg-base);position:sticky;top:45px;z-index:9}
.tab{flex:1;padding:11px 8px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:color 150ms,border-color 150ms}
.tab.on{color:var(--text-primary);border-bottom-color:var(--green)}

/* content */
.content{flex:1;overflow-y:auto;padding:20px}
.panel{display:none}
.panel.on{display:block}

/* stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:20px}
.stat-box{background:var(--bg-surface);padding:16px 18px}
.stat-label{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px}
.stat-val{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1}
.stat-sub{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary);margin-top:6px}

/* section header */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 16px;border:1px solid var(--border);border-bottom:none;background:var(--bg-elevated)}
.sec-title{font-family:var(--mono);font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--text-muted)}
.sec-cnt{font-family:var(--mono);font-size:10px;color:var(--text-muted)}

/* table */
.tbl-wrap{overflow-x:auto;margin-bottom:20px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
thead tr{border-bottom:1px solid var(--border)}
th{padding:8px 14px;text-align:right;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);font-weight:400;white-space:nowrap;background:var(--bg-elevated)}
th.l{text-align:left}
td{padding:10px 14px;text-align:right;border-bottom:1px solid rgba(255,255,255,.025);color:var(--text-secondary);white-space:nowrap}
td.l{text-align:left;color:var(--text-primary);font-weight:700}
tr:last-child td{border-bottom:none}

/* signals */
.sig-wrap{border:1px solid var(--border);margin-bottom:20px}
.sig-row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:10px 16px;font-family:var(--mono);border-bottom:1px solid rgba(255,255,255,.025)}
.sig-row:last-child{border-bottom:none}

/* badges */
.bdg{font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.12em;padding:2px 7px;border:1px solid;text-transform:uppercase;flex-shrink:0}
.bl{color:var(--green);border-color:rgba(0,212,170,.3);background:var(--green-dim)}
.bs{color:var(--red);border-color:rgba(255,77,109,.3);background:var(--red-dim)}
.bw{color:var(--green);border-color:rgba(0,212,170,.3);background:var(--green-dim)}
.bx{color:var(--red);border-color:rgba(255,77,109,.3);background:var(--red-dim)}

/* empty */
.empty{padding:32px 20px;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-muted);border:1px solid var(--border);margin-bottom:20px}

/* footer */
.footer{padding:16px 20px;padding-bottom:max(16px,env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--bg-base)}
#pbtn{width:100%;padding:13px;border:1px solid;background:none;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;cursor:pointer;transition:opacity 150ms}
#pbtn:disabled{opacity:.4;cursor:not-allowed}
.brun{color:var(--red);border-color:rgba(255,77,109,.3);background:var(--red-dim)!important}
.bpsd{color:var(--green);border-color:rgba(0,212,170,.3);background:var(--green-dim)!important}

/* loading/error */
.center{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:16px;padding:40px 24px}
.spin{width:24px;height:24px;border:1.5px solid var(--border-hi);border-top-color:var(--text-primary);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.smsg{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.err-box{border:1px solid var(--border-hi);background:var(--bg-surface);padding:24px;max-width:300px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.etag{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);border:1px solid rgba(255,77,109,.25);background:var(--red-dim);padding:3px 10px}
.etitle{font-size:13px;font-weight:600;line-height:1.4}
.edetail{font-family:var(--mono);font-size:10px;color:var(--text-secondary);line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <div class="center" id="loading">
    <div class="spin"></div>
    <div id="smsg" class="smsg">Initializing…</div>
  </div>
</div>
<script>
'use strict';
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let _token = null, _paused = false;

const $    = id => document.getElementById(id);
const mk   = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const node = (tag, cls, t) => { const e = mk(tag, cls); e.textContent = t; return e; };
const setS = m => { const e = $('smsg'); if (e) e.textContent = m; };
const esc  = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function fmt(n, d=2) { return Number(n ?? 0).toFixed(d); }
function fmtP(v) { const n=+v; if (!n) return '—'; return n>=10000?n.toFixed(1):n>=100?n.toFixed(2):n.toFixed(4); }
function sign(n)  { return +n >= 0 ? '+' : ''; }
function ago(ts) {
  if (!ts) return '—';
  const m = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm ago';
  if (m < 1440) return Math.floor(m/60) + 'h ago';
  return Math.floor(m/1440) + 'd ago';
}

/* tab switching */
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + name));
}

/* stat box */
function mkStat(label, value, sub, color) {
  const box = mk('div','stat-box');
  const lbl = node('div','stat-label', label);
  const val = node('div','stat-val', value);
  if (color) val.style.color = color;
  box.appendChild(lbl);
  box.appendChild(val);
  if (sub) box.appendChild(node('div','stat-sub', sub));
  return box;
}

/* section header */
function mkSecHdr(title, cnt) {
  const h = mk('div','sec-hdr');
  h.appendChild(node('span','sec-title', title));
  h.appendChild(node('span','sec-cnt', String(cnt)));
  return h;
}

/* positions table */
function mkPosTable(positions) {
  if (!positions?.length) return node('div','empty', 'No open positions');
  const wrap = mk('div','tbl-wrap');
  const tbl  = mk('table');

  /* head */
  const thead = mk('thead');
  const tr0   = mk('tr');
  ['Symbol','Side','Lev','Entry','Mark','uPnL (USDT)','ROE%'].forEach((h, i) => {
    const th = node('th', i === 0 ? 'l' : '', h);
    tr0.appendChild(th);
  });
  thead.appendChild(tr0);
  tbl.appendChild(thead);

  /* body */
  const tbody = mk('tbody');
  positions.forEach(p => {
    const pnl  = +(p.unrealized_pnl ?? 0);
    const isP  = pnl >= 0;
    const pc   = isP ? 'var(--green)' : 'var(--red)';
    const sc   = p.side === 'LONG' ? 'var(--green)' : 'var(--red)';
    const row  = mk('tr');
    row.onmouseenter = () => { row.style.background = 'rgba(255,255,255,0.025)'; };
    row.onmouseleave = () => { row.style.background = ''; };

    const cells = [
      { t: p.symbol,                        cls: 'l', extra: null },
      { t: p.side,                          cls: '', extra: { color: sc, fontWeight: '700' } },
      { t: (p.leverage ?? '—') + '×',       cls: '', extra: { color: 'var(--text-muted)' } },
      { t: fmtP(p.entry_price),             cls: '', extra: { color: 'var(--text-secondary)' } },
      { t: fmtP(p.mark_price),              cls: '', extra: { color: 'var(--text-secondary)' } },
      { t: sign(pnl) + fmt(pnl),            cls: '', extra: { color: pc, fontWeight: '700' } },
      { t: sign(p.pnl_pct) + fmt(p.pnl_pct) + '%', cls: '', extra: { color: pc } },
    ];

    cells.forEach(({ t, cls, extra }) => {
      const td = node('td', cls, t);
      if (extra) Object.assign(td.style, extra);
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);
  return wrap;
}

/* Overview panel */
function mkOverview(data) {
  const { balance, positions } = data;
  const upnl = +(balance?.unrealized_pnl ?? 0);
  const panel = mk('div','panel on');
  panel.id = 'p-overview';

  const grid = mk('div','stat-grid');
  grid.appendChild(mkStat('Balance', '$' + fmt(balance?.usdt_wallet), 'USDT'));
  grid.appendChild(mkStat('Unrealized PnL', sign(upnl) + fmt(upnl), 'USDT',
    upnl > 0 ? 'var(--green)' : upnl < 0 ? 'var(--red)' : null));
  if (balance?.usdt_equity != null) {
    grid.appendChild(mkStat('Equity', '$' + fmt(balance.usdt_equity), 'USDT'));
    grid.appendChild(mkStat('Available', '$' + fmt(balance.usdt_free), 'USDT'));
  }
  panel.appendChild(grid);

  const cnt = (positions || []).length;
  panel.appendChild(mkSecHdr('Open Positions', cnt));
  panel.appendChild(mkPosTable((positions || []).slice(0, 8)));
  return panel;
}

/* Positions panel */
function mkPositions(positions) {
  const panel = mk('div','panel');
  panel.id = 'p-positions';
  panel.appendChild(mkSecHdr('Open Positions', (positions || []).length));
  panel.appendChild(mkPosTable(positions));
  return panel;
}

/* Signals panel */
function mkSignals(signals) {
  const panel = mk('div','panel');
  panel.id = 'p-signals';
  const list = (signals || []).slice(0, 25);
  panel.appendChild(mkSecHdr('Recent Signals', list.length));
  if (!list.length) {
    panel.appendChild(node('div','empty', 'No signals yet'));
  } else {
    const wrap = mk('div','sig-wrap');
    list.forEach(s => {
      const row  = mk('div','sig-row');
      const bdg  = node('span', 'bdg ' + (s.action === 'LONG' ? 'bl' : 'bs'), s.action || '—');
      const coin = node('span', '', s.coin || '—');
      coin.style.cssText = 'font-size:12px;font-weight:700;color:var(--text-primary)';
      const res  = mk('span');
      if (s.result) { res.className = 'bdg ' + (s.result === 'WIN' ? 'bw' : 'bx'); res.textContent = s.result; }
      const t = node('span','', ago(s.timestamp));
      t.style.cssText = 'font-size:9px;color:var(--text-muted);letter-spacing:.06em';
      row.appendChild(bdg); row.appendChild(coin); row.appendChild(res); row.appendChild(t);
      wrap.appendChild(row);
    });
    panel.appendChild(wrap);
  }
  return panel;
}

/* render */
function render(data) {
  _paused = data.paused;
  const app = $('app');
  app.textContent = '';

  /* header */
  const hdr = mk('div','hdr');
  hdr.appendChild(node('div','logo', 'KADO'));
  const hr = mk('div','hdr-r');
  const stLbl = node('span','lbl', _paused ? 'Paused' : 'Live'); stLbl.id = 'st-lbl';
  const stDot = mk('div','dot ' + (_paused ? 'psd' : 'live')); stDot.id = 'st-dot';
  hr.appendChild(stLbl); hr.appendChild(stDot);
  hdr.appendChild(hr);
  app.appendChild(hdr);

  /* tabs */
  const tabRow = mk('div','tabs');
  [['overview','Overview'],['positions','Positions'],['signals','Signals']].forEach(([id,lbl]) => {
    const b = node('button','tab' + (id==='overview'?' on':''), lbl);
    b.dataset.tab = id; b.onclick = () => switchTab(id);
    tabRow.appendChild(b);
  });
  app.appendChild(tabRow);

  /* panels */
  const content = mk('div','content');
  content.appendChild(mkOverview(data));
  content.appendChild(mkPositions(data.positions));
  content.appendChild(mkSignals(data.signals));
  app.appendChild(content);

  /* footer */
  const footer = mk('div','footer');
  const btn = mk('button');
  btn.id = 'pbtn'; btn.className = _paused ? 'bpsd' : 'brun';
  btn.textContent = _paused ? '▶  Resume Bot' : '⏸  Pause Bot';
  btn.onclick = togglePause;
  footer.appendChild(btn);
  app.appendChild(footer);
}

/* error */
function showError(msg) {
  const m = String(msg || '');
  const isBybit = /bybit|api key|not configured|keys/i.test(m);
  const isAuth  = /auth|401|403|token|unauthorized/i.test(m);
  const isTime  = /timeout|abort|timed out/i.test(m);
  const title  = isBybit ? 'API keys not connected' : isAuth ? 'Authentication failed' : isTime ? 'Connection timeout' : 'Something went wrong';
  const detail = isBybit ? 'Connect your Bybit API keys in Settings to enable the dashboard.'
               : isAuth  ? 'Open this app through the Telegram bot.'
               : isTime  ? 'Server took too long. Please try again.'
               : m || 'Unexpected error.';
  const app = $('app'); app.textContent = '';
  const wrap = mk('div','center'), box = mk('div','err-box');
  box.appendChild(node('div','etag', 'Error'));
  box.appendChild(node('div','etitle', title));
  box.appendChild(node('div','edetail', detail));
  wrap.appendChild(box); app.appendChild(wrap);
}

/* pause toggle */
async function togglePause() {
  if (!_token) return;
  const btn = $('pbtn');
  if (btn) btn.disabled = true;
  try {
    const res = await fetch('/api/webapp/pause', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Webapp-Token': _token },
      body: JSON.stringify({ pause: !_paused }),
    });
    if (res.ok) {
      _paused = !_paused;
      if (btn) { btn.className = _paused ? 'bpsd' : 'brun'; btn.textContent = _paused ? '▶  Resume Bot' : '⏸  Pause Bot'; }
      const dot = $('st-dot'), lbl = $('st-lbl');
      if (dot) dot.className = 'dot ' + (_paused ? 'psd' : 'live');
      if (lbl) lbl.textContent = _paused ? 'Paused' : 'Live';
    }
  } finally {
    if (btn) btn.disabled = false;
  }
}

/* init */
async function init() {
  setS('Connecting…');
  try {
    const res = await fetch('/api/webapp/init', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: tg?.initData || '' }),
      signal: AbortSignal.timeout(12000),
    });
    setS('Verifying…');
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      showError(e.detail || 'Auth failed (' + res.status + ')');
      return;
    }
    render(await res.json());
  } catch(e) {
    showError(e?.message || String(e));
  }
}
init();
</script>
</body>
</html>
