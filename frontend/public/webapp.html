<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KADO Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:    var(--tg-theme-bg-color, #0a0a0a);
    --bg2:   var(--tg-theme-secondary-bg-color, #141414);
    --fg:    var(--tg-theme-text-color, #ffffff);
    --muted: var(--tg-theme-hint-color, rgba(255,255,255,0.4));
    --border: rgba(255,255,255,0.08);
    --green: #22c55e;
    --red:   #ef4444;
    --font:  -apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
    --mono:  'SF Mono','Courier New',monospace;
  }
  html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); }
  body { padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0); }
  #app { display: flex; flex-direction: column; min-height: 100vh; }

  .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; border-bottom: 1px solid var(--border); }
  .logo { font-family: var(--mono); font-size: 15px; font-weight: 700; letter-spacing: 0.25em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.on  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.off { background: var(--red);   box-shadow: 0 0 6px var(--red); }

  .content { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .section-label { font-size: 10px; font-family: var(--mono); letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }

  .balance-val { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  .balance-sub { font-size: 12px; margin-top: 4px; }

  .pos-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .pos-item:last-child { border-bottom: none; }
  .pos-symbol { font-size: 14px; font-weight: 600; }
  .pos-side { font-size: 10px; font-family: var(--mono); letter-spacing: 0.1em; }
  .long { color: var(--green); }
  .short { color: var(--red); }
  .pos-pnl { font-size: 15px; font-weight: 600; }
  .pos-entry { font-size: 10px; color: var(--muted); text-align: right; }

  .sig-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .sig-item:last-child { border-bottom: none; }
  .sig-badge { font-size: 9px; font-family: var(--mono); letter-spacing: 0.1em; padding: 3px 7px; border-radius: 4px; font-weight: 700; flex-shrink: 0; }
  .badge-long  { background: rgba(34,197,94,0.15); color: var(--green); }
  .badge-short { background: rgba(239,68,68,0.15);  color: var(--red); }
  .sig-coin { font-size: 13px; font-weight: 600; }
  .sig-time { font-size: 10px; color: var(--muted); margin-left: auto; }
  .sig-res { font-size: 10px; font-family: var(--mono); padding: 2px 6px; border-radius: 3px; }
  .res-win  { background: rgba(34,197,94,0.1); color: var(--green); }
  .res-loss { background: rgba(239,68,68,0.1);  color: var(--red); }

  .empty { text-align: center; padding: 20px 0; font-size: 12px; color: var(--muted); }

  .footer { padding: 16px 20px; padding-bottom: max(16px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
  #pause-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
  #pause-btn:active { opacity: 0.7; }
  #pause-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-running { background: rgba(239,68,68,0.12); color: var(--red); border: 1px solid rgba(239,68,68,0.25) !important; }
  .btn-paused  { background: rgba(34,197,94,0.12); color: var(--green); border: 1px solid rgba(34,197,94,0.25) !important; }

  .center { display: flex; align-items: center; justify-content: center; min-height: 60vh; flex-direction: column; gap: 12px; }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--fg); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .err-icon { font-size: 28px; }
  .err-msg { font-size: 13px; color: var(--muted); max-width: 260px; line-height: 1.5; text-align: center; }
</style>
</head>
<body>
<div id="app">
  <div class="center" id="loading-screen">
    <div class="spinner"></div>
    <div id="status-msg" style="font-size:11px;color:var(--muted);margin-top:12px;">Initializing…</div>
  </div>
</div>

<script>
'use strict';
function setStatus(msg) {
  const el = document.getElementById('status-msg');
  if (el) el.textContent = msg;
}

// Telegram injects window.Telegram.WebApp natively before page load.
// The external script is a polyfill — we don't wait for it.
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let _token  = null;
let _paused = false;

// ── helpers ────────────────────────────────────────────────────────────────
function fmt(n)  { return Number(n || 0).toFixed(2); }
function sign(n) { return n >= 0 ? '+' : '-'; }

function timeAgo(ts) {
  if (!ts) return '';
  const d    = new Date(typeof ts === 'number' ? ts : ts);
  const diff = Math.floor((Date.now() - d) / 60000);
  if (diff < 1)    return 'just now';
  if (diff < 60)   return diff + 'm ago';
  if (diff < 1440) return Math.floor(diff / 60) + 'h ago';
  return Math.floor(diff / 1440) + 'd ago';
}

function el(tag, cls, txt) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}

// ── build DOM from safe data ────────────────────────────────────────────────
function buildHeader(paused) {
  const h = el('div', 'header');
  h.appendChild(el('div', 'logo', 'KADO'));
  h.appendChild(el('div', 'dot ' + (paused ? 'off' : 'on')));
  return h;
}

function buildBalance(balance) {
  const upnl  = Number(balance?.unrealized_pnl || 0);
  const wrap  = el('div');
  wrap.appendChild(el('div', 'section-label', 'USDT Balance'));
  const card  = el('div', 'card');
  card.appendChild(el('div', 'balance-val', '$' + fmt(balance?.usdt_wallet)));
  const sub   = el('div', 'balance-sub', 'Unrealized PnL: ' + sign(upnl) + '$' + fmt(Math.abs(upnl)));
  sub.style.color = upnl >= 0 ? 'var(--green)' : 'var(--red)';
  card.appendChild(sub);
  wrap.appendChild(card);
  return wrap;
}

function buildPositions(positions) {
  const wrap = el('div');
  wrap.appendChild(el('div', 'section-label', 'Open Positions (' + (positions || []).length + ')'));
  const card = el('div', 'card');
  if (!(positions || []).length) {
    card.appendChild(el('div', 'empty', 'No open positions'));
  } else {
    positions.forEach(p => {
      const pnl   = Number(p.unrealized_pnl || 0);
      const row   = el('div', 'pos-item');
      const left  = el('div');
      left.appendChild(el('div', 'pos-symbol', p.symbol));
      const side  = el('div', 'pos-side ' + (p.side === 'LONG' ? 'long' : 'short'),
                       p.side + ' ' + p.leverage + '\xD7');
      left.appendChild(side);
      row.appendChild(left);
      const right = el('div');
      const pnlEl = el('div', 'pos-pnl ' + (pnl >= 0 ? 'long' : 'short'),
                       sign(pnl) + '$' + fmt(Math.abs(pnl)));
      right.appendChild(pnlEl);
      right.appendChild(el('div', 'pos-entry', '@ ' + fmt(p.entry_price)));
      row.appendChild(right);
      card.appendChild(row);
    });
  }
  wrap.appendChild(card);
  return wrap;
}

function buildSignals(signals) {
  const wrap = el('div');
  wrap.appendChild(el('div', 'section-label', 'Recent Signals'));
  const card = el('div', 'card');
  const list = (signals || []).slice(0, 8);
  if (!list.length) {
    card.appendChild(el('div', 'empty', 'No recent signals'));
  } else {
    list.forEach(s => {
      const row   = el('div', 'sig-item');
      const badge = el('span', 'sig-badge ' + (s.action === 'LONG' ? 'badge-long' : 'badge-short'), s.action);
      row.appendChild(badge);
      row.appendChild(el('span', 'sig-coin', s.coin));
      if (s.result) {
        const res = el('span', 'sig-res ' + (s.result === 'WIN' ? 'res-win' : 'res-loss'), s.result);
        row.appendChild(res);
      }
      row.appendChild(el('span', 'sig-time', timeAgo(s.timestamp)));
      card.appendChild(row);
    });
  }
  wrap.appendChild(card);
  return wrap;
}

function buildFooter(paused) {
  const footer = el('div', 'footer');
  const btn    = document.createElement('button');
  btn.id        = 'pause-btn';
  btn.className = paused ? 'btn-paused' : 'btn-running';
  btn.textContent = paused ? '▶ Resume Bot' : '⏸ Pause Bot';
  btn.addEventListener('click', togglePause);
  footer.appendChild(btn);
  return footer;
}

// ── render ─────────────────────────────────────────────────────────────────
function render(data) {
  const { balance, positions, signals, paused } = data;
  _paused = paused;

  const app = document.getElementById('app');
  app.textContent = '';                        // clear safely

  app.appendChild(buildHeader(paused));

  const content = el('div', 'content');
  content.appendChild(buildBalance(balance));
  content.appendChild(buildPositions(positions));
  content.appendChild(buildSignals(signals));
  app.appendChild(content);

  app.appendChild(buildFooter(paused));
}

function showError(msg) {
  const app  = document.getElementById('app');
  app.textContent = '';
  const wrap = el('div', 'center');
  wrap.appendChild(el('div', 'err-icon', '⚠'));
  wrap.appendChild(el('div', 'err-msg', msg));
  app.appendChild(wrap);
}

// ── pause toggle ───────────────────────────────────────────────────────────
async function togglePause() {
  if (!_token) return;
  const btn = document.getElementById('pause-btn');
  if (btn) btn.disabled = true;
  try {
    const res = await fetch('/api/webapp/pause', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', 'X-Webapp-Token': _token },
      body:    JSON.stringify({ pause: !_paused }),
    });
    if (res.ok) {
      _paused = !_paused;
      if (btn) {
        btn.className   = _paused ? 'btn-paused'  : 'btn-running';
        btn.textContent = _paused ? '▶ Resume Bot' : '⏸ Pause Bot';
      }
      const dot = document.querySelector('.dot');
      if (dot) { dot.className = 'dot ' + (_paused ? 'off' : 'on'); }
    }
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ── init ───────────────────────────────────────────────────────────────────
async function init() {
  const initData = tg?.initData || '';
  setStatus('Connecting to server…');
  try {
    const res = await fetch('/api/webapp/init', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ init_data: initData }),
      signal:  AbortSignal.timeout(12000),
    });
    setStatus('Verifying…');
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showError(err.detail || 'Auth failed (' + res.status + ')');
      return;
    }
    const data = await res.json();
    _token = data.token;
    render(data);
  } catch (e) {
    showError('Error: ' + (e?.message || String(e)));
  }
}

init();
</script>
</body>
</html>
