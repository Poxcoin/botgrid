<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KADO</title>
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<style>
:root{
  --bg:#050505;--bg2:#0a0a0a;--bg3:#111111;--bg4:#161616;
  --fg:#f0f2f5;--fg2:#8b95a8;--fg3:#4a5568;
  --b:rgba(255,255,255,0.06);--bhi:rgba(255,255,255,0.10);
  --g:#00d4aa;--gdim:rgba(0,212,170,0.12);
  --r:#ff4d6d;--rdim:rgba(255,77,109,0.12);
  --mono:'SF Mono','Courier New',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}
#app{display:flex;flex-direction:column;height:100dvh;max-height:100dvh;padding-top:env(safe-area-inset-top)}

/* header */
.hdr{height:48px;flex-shrink:0;display:flex;align-items:center;padding:0 14px;gap:10px;border-bottom:1px solid var(--b)}
.hdr-burger{font-size:19px;color:var(--fg2);padding:4px;line-height:1}
.hdr-logo{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.35em}
.hdr-page{flex:1;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px}
.hdr-status{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9px;color:var(--fg3);flex-shrink:0}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-on{background:var(--g);box-shadow:0 0 5px var(--g)}
.dot-off{background:var(--fg3)}

/* scroll */
#scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--b) transparent}

/* pages */
.page{display:none;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));min-height:100%}
.page.active{display:block}

/* drawer */
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200}
.backdrop.open{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:264px;background:var(--bg);border-right:1px solid var(--b);display:flex;flex-direction:column;z-index:201;transform:translateX(-100%);transition:transform .22s ease}
.drawer.open{transform:translateX(0)}
.d-head{height:56px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--b);justify-content:space-between;flex-shrink:0}
.d-logo{font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.35em}
.d-close{font-size:20px;color:var(--fg3);padding:4px}
.d-nav{flex:1;overflow-y:auto;scrollbar-width:none;padding:6px 0}
.d-nav::-webkit-scrollbar{display:none}
.d-div{height:1px;background:var(--b);margin:5px 0}
.d-item{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;min-height:42px;font-size:13px;color:var(--fg2);text-align:left;transition:background .1s,color .1s}
.d-item:hover{color:var(--fg);background:rgba(255,255,255,.03)}
.d-item.on{background:var(--fg);color:var(--bg)}
.d-sub-item{padding-left:34px}
.d-sub{overflow:hidden;max-height:0;transition:max-height .28s ease}
.d-sub.open{max-height:700px}
.d-foot{border-top:1px solid var(--b);padding:10px 18px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.d-username{flex:1;font-family:var(--mono);font-size:10px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* stat cards */
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:18px}
.sc{background:var(--bg2);border:1px solid var(--b);padding:18px 14px}
.sc-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin-bottom:10px}
.sc-val{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.sc-sub{font-family:var(--mono);font-size:9px;color:var(--fg3);margin-top:5px}
.col-g{color:var(--g)}
.col-r{color:var(--r)}

/* section label */
.sl{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--b);padding-bottom:9px;margin:18px 0 13px}
.sl-t{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
.sl-r{font-family:var(--mono);font-size:9px;color:var(--fg3)}

/* positions table */
.pt{border:1px solid var(--b);margin-bottom:14px}
.pt-hdr{height:36px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--b)}
.pt-hdr-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg3)}
.pt-hdr-cnt{font-family:var(--mono);font-size:11px;color:var(--fg2)}
.pt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pt table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;min-width:460px}
.pt th{padding:7px 12px;text-align:right;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3);font-weight:400;border-bottom:1px solid var(--b)}
.pt th:first-child{text-align:left}
.pt td{padding:9px 12px;text-align:right;color:var(--fg2);border-bottom:1px solid rgba(255,255,255,.025)}
.pt td:first-child{text-align:left;color:var(--fg);font-weight:700}
.pt tr:last-child td{border-bottom:none}

/* signals */
.sig-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--b);background:var(--bg2);margin-bottom:5px}
.sig-coin{font-family:var(--mono);font-size:12px;color:var(--fg);font-weight:600}
.sig-meta{font-family:var(--mono);font-size:9px;color:var(--fg3);margin-top:2px}
.side-l{font-family:var(--mono);font-size:9px;color:var(--g);background:var(--gdim);padding:2px 6px;margin-left:7px}
.side-s{font-family:var(--mono);font-size:9px;color:var(--r);background:var(--rdim);padding:2px 6px;margin-left:7px}
.sig-res{font-family:var(--mono);font-size:12px;font-weight:700}

/* chart */
.coin-pills{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px;margin-bottom:10px}
.coin-pills::-webkit-scrollbar{display:none}
.c-pill{font-family:var(--mono);font-size:10px;padding:5px 9px;border:1px solid var(--b);color:var(--fg3);white-space:nowrap;flex-shrink:0;transition:all .1s}
.c-pill:hover,.c-pill.on{border-color:var(--fg3);color:var(--fg)}
.tf-pills{display:flex;gap:4px;margin-bottom:10px}
.tf-pill{font-family:var(--mono);font-size:9px;padding:4px 8px;border:1px solid var(--b);color:var(--fg3);transition:all .1s}
.tf-pill:hover,.tf-pill.on{border-color:var(--fg3);color:var(--fg)}
.chart-box{background:var(--bg2);border:1px solid var(--b);margin-bottom:12px;overflow:hidden}
.chart-loading{height:200px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--fg3)}
.trades-box{height:180px;overflow-y:auto;border:1px solid var(--b);scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.trade-row{display:grid;grid-template-columns:1fr auto;padding:3px 12px;gap:8px}

/* news */
.news-cats{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px;margin-bottom:14px}
.news-cats::-webkit-scrollbar{display:none}
.cat-pill{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--b);color:var(--fg3);white-space:nowrap;flex-shrink:0;transition:all .1s}
.cat-pill:hover,.cat-pill.on{border-color:var(--fg3);color:var(--fg)}
.news-card{border:1px solid var(--b);padding:13px;margin-bottom:7px}
.news-cat{font-family:var(--mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3)}
.news-title{font-size:13px;font-weight:600;line-height:1.44;color:var(--fg);margin:6px 0 5px}
.news-source{font-family:var(--mono);font-size:9px;color:var(--fg3)}
.news-desc{font-size:11px;color:var(--fg2);line-height:1.55;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* prices */
.price-hdr{display:grid;grid-template-columns:64px 1fr 68px 62px;padding:7px 14px;border-bottom:1px solid var(--b)}
.price-hdr span{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3)}
.price-row{display:grid;grid-template-columns:64px 1fr 68px 62px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.025);align-items:center}
.price-coin{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--fg)}
.price-val{font-family:var(--mono);font-size:12px;font-weight:600;text-align:right}
.price-chg{font-family:var(--mono);font-size:11px;font-weight:600;text-align:right}
.price-vol{font-family:var(--mono);font-size:9px;color:var(--fg3);text-align:right}

/* strategies */
.strat-card{background:var(--bg2);border:1px solid var(--b);padding:22px 18px;margin-bottom:10px}
.strat-num{font-family:var(--mono);font-size:9px;color:var(--fg3);letter-spacing:.08em;margin-bottom:14px}
.strat-name{font-size:18px;font-weight:700;letter-spacing:-.02em;margin-bottom:7px}
.strat-desc{font-size:12px;color:var(--fg2);line-height:1.65;margin-bottom:14px}
.strat-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:18px}
.strat-tag{font-family:var(--mono);font-size:8px;background:var(--b);border:1px solid rgba(255,255,255,.1);padding:3px 8px;color:var(--fg3)}
.strat-price{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:-.03em;color:var(--fg)}
.strat-per{font-family:var(--mono);font-size:9px;color:var(--fg3);margin-top:2px}
.cmp-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}
.cmp-table th{padding:7px 10px;text-align:center;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);font-weight:400;border-bottom:1px solid var(--b)}
.cmp-table th:first-child{text-align:left}
.cmp-table td{padding:8px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.025);color:var(--fg2)}
.cmp-table td:first-child{text-align:left;color:var(--fg)}

/* account */
.acc-row{display:flex;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--b);gap:12px}
.acc-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);min-width:80px;flex-shrink:0;padding-top:3px}
.acc-val{font-size:13px;color:var(--fg);line-height:1.5}
.plan-badge{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--g);color:var(--g)}
.btn-p{padding:11px 22px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:opacity .15s}
.btn-p:active{opacity:.75}
.btn-red{background:var(--r);color:#fff}
.btn-grn{background:var(--g);color:var(--bg)}
.btn-inv{background:transparent;color:var(--fg);border:1px solid var(--b)}
.btn-wht{background:var(--fg);color:var(--bg)}

/* misc */
.empty{font-family:var(--mono);font-size:11px;color:var(--fg3);text-align:center;padding:36px 0}
.skel{background:var(--bg3);animation:skel 1.4s ease-in-out infinite}
@keyframes skel{0%,100%{opacity:.35}50%{opacity:.75}}
.info-box{border:1px solid var(--b);padding:14px;background:var(--bg2);margin-bottom:12px;font-family:var(--mono);font-size:11px;color:var(--fg2);line-height:1.7}

/* splash */
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999}
.sp-logo{font-family:var(--mono);font-size:18px;font-weight:700;letter-spacing:.35em;margin-bottom:22px}
.sp-msg{font-family:var(--mono);font-size:10px;color:var(--fg3);letter-spacing:.12em}
.sp-err{text-align:center;padding:20px}
.sp-err-t{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--r);margin-bottom:8px}
.sp-err-b{font-family:var(--mono);font-size:10px;color:var(--fg3);line-height:1.7}
</style>
</head>
<body>

<div id="splash">
  <div class="sp-logo">KADO</div>
  <div class="sp-msg" id="sp-msg">Connecting…</div>
</div>

<div id="app" style="display:none">

  <!-- HEADER -->
  <div class="hdr">
    <button class="hdr-burger" onclick="openDrawer()">☰</button>
    <div class="hdr-logo">KADO</div>
    <div class="hdr-page" id="hdr-page">Balance</div>
    <div class="hdr-status">
      <span class="dot dot-on" id="st-dot"></span>
      <span id="st-lbl">Live</span>
    </div>
  </div>

  <!-- BACKDROP -->
  <div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>

  <!-- DRAWER -->
  <div class="drawer" id="drawer">
    <div class="d-head">
      <span class="d-logo">KADO</span>
      <button class="d-close" onclick="closeDrawer()">✕</button>
    </div>
    <div class="d-nav" id="d-nav"></div>
    <div class="d-foot">
      <span class="d-username" id="d-user">—</span>
    </div>
  </div>

  <!-- CONTENT -->
  <div id="scroll">

    <!-- OVERVIEW / BALANCE -->
    <div class="page active" id="page-overview">
      <div class="sc-grid" id="ov-cards">
        <div class="sc"><div class="sc-lbl">Wallet</div><div class="skel" style="height:22px;width:80%;margin-top:2px"></div></div>
        <div class="sc"><div class="sc-lbl">Equity</div><div class="skel" style="height:22px;width:70%;margin-top:2px"></div></div>
        <div class="sc"><div class="sc-lbl">Free</div><div class="skel" style="height:22px;width:60%;margin-top:2px"></div></div>
        <div class="sc"><div class="sc-lbl">uPnL</div><div class="skel" style="height:22px;width:75%;margin-top:2px"></div></div>
      </div>
      <div class="sl"><span class="sl-t">Open Positions</span><span class="sl-r" id="ov-pos-cnt">—</span></div>
      <div id="ov-positions"><div class="empty">Loading…</div></div>
      <div class="sl"><span class="sl-t">Recent Signals</span></div>
      <div id="ov-signals"><div class="empty">Loading…</div></div>
    </div>

    <!-- NEWS -->
    <div class="page" id="page-news">
      <div class="news-cats" id="news-cats"></div>
      <div id="news-list"><div class="empty">Loading…</div></div>
    </div>

    <!-- PRICES -->
    <div class="page" id="page-prices">
      <div class="sl"><span class="sl-t">Market Prices</span><span class="sl-r" id="prices-ts">—</span></div>
      <div id="prices-list"><div class="empty">Loading…</div></div>
    </div>

    <!-- STRATEGIES -->
    <div class="page" id="page-strategies">
      <div id="strat-inner"></div>
    </div>

    <!-- ACCOUNT -->
    <div class="page" id="page-account">
      <div class="sl"><span class="sl-t">Account</span></div>
      <div id="acc-inner"><div class="empty">Loading…</div></div>
    </div>

    <!-- API KEYS -->
    <div class="page" id="page-api-keys">
      <div class="sl"><span class="sl-t">API Keys</span></div>
      <div id="keys-inner"></div>
    </div>

    <!-- SECURITY -->
    <div class="page" id="page-security">
      <div class="sl"><span class="sl-t">Security</span></div>
      <div id="sec-inner"></div>
    </div>

    <!-- SETTINGS -->
    <div class="page" id="page-settings">
      <div class="sl"><span class="sl-t">Settings</span></div>
      <div class="info-box">Full settings (language, notifications, theme) are available on the dashboard at <a href="https://kadoclub.net/dashboard" target="_blank" style="color:var(--g)">kadoclub.net</a></div>
    </div>

    <!-- BOT PAGES injected dynamically -->

  </div>
</div>

<script>
/* ─── Telegram ─── */
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ─── state ─── */
let _token='', _paused=false, _data=null;
let _newsCat='ALL', _newsAll=[], _newsLoaded=false;
let _curBot='', _curCoin='BTC', _curTf='15';
let _tradeWs=null, _activePage='overview';

/* ─── bot defs ─── */
const BOTS=[
  {id:'signal',    label:'Signal',         coins:['WLD','JUP','ARB','RUNE','XRP','ONDO','PENDLE','LDO','LINK','UNI','INJ','SUI','CRV']},
  {id:'sweep',     label:'Liq Sweep',      coins:['ETH','SOL']},
  {id:'fr',        label:'Funding Rate',   coins:['INJ','ONDO','WLD','JUP','ARB','UNI','LDO','LINK','BTC','ETH','SOL']},
  {id:'grid',      label:'Grid',           coins:['BTC','ETH','SOL']},
  {id:'cascade',   label:'Cascade',        coins:['ETH','SOL','DOGE','LINK','BTC','XRP','ADA','AVAX','INJ','SUI']},
  {id:'orderflow', label:'Orderflow',      coins:['BTC','ETH','SOL']},
  {id:'ob',        label:'Order Block',    coins:['BTC','ETH']},
  {id:'macro',     label:'Macro',          coins:['BTC','ETH','SOL']},
  {id:'listing',   label:'Listing Sniper', coins:['BTC','ETH','SOL','BNB']},
  {id:'dex',       label:'DEX Sniper',     coins:['BTC','ETH','SOL','AVAX']},
  {id:'history',   label:'History',        coins:['BTC','ETH','SOL','XRP','LINK','INJ','WLD','JUP']},
];

const PRICE_COINS=['BTC','ETH','SOL','BNB','XRP','DOGE','ADA','AVAX','LINK','TON','PEPE','SUI','INJ','ARB','UNI','WLD'];
const TFS=[{v:'1',l:'1m'},{v:'5',l:'5m'},{v:'15',l:'15m'},{v:'60',l:'1h'},{v:'240',l:'4h'},{v:'D',l:'1D'}];

const STRATEGIES=[
  {num:'01',name:'Steady',price:'$19',
   summary:'Grid trading with automated range rebalancing. Low-risk, consistent yield for stable conditions.',
   tags:['Grid Trading','Auto-Rebalance','Low Risk']},
  {num:'02',name:'Balanced',price:'$49',
   summary:'Combines Grid, Funding Rate Arb and Liquidation Cascade for diversified returns across market cycles.',
   tags:['Grid Trading','Funding Rate','Cascade','Balanced Risk']},
  {num:'03',name:'Full Suite',price:'$89',
   summary:'All active strategies including Listing Sniper, On-chain Macro, DEX Sniper and more.',
   tags:['All Bots','Listing Sniper','DEX Sniper','Macro','Max Yield']},
];

const CMP_ROWS=[
  ['Grid Trading',     true, true, true],
  ['Funding Rate Arb', false,true, true],
  ['Cascade DCA',      false,true, true],
  ['Listing Sniper',   false,false,true],
  ['On-chain Macro',   false,false,true],
  ['Orderflow',        false,false,true],
  ['Order Block',      false,false,true],
  ['DEX Sniper',       false,false,true],
];

const CAT_IDS=['ALL','CRYPTO','MACRO','GEOPOLITICS','COMMODITIES','MARKETS','ON-CHAIN','LISTINGS'];
const CAT_BG={
  GEOPOLITICS:'linear-gradient(135deg,#1a0808,#2a1010)',
  MACRO:       'linear-gradient(135deg,#08081a,#10102a)',
  COMMODITIES: 'linear-gradient(135deg,#081a08,#102a10)',
  MARKETS:     'linear-gradient(135deg,#1a1a08,#2a2a10)',
  'ON-CHAIN':  'linear-gradient(135deg,#081a1a,#102a2a)',
  LISTINGS:    'linear-gradient(135deg,#1a081a,#2a102a)',
  CRYPTO:      'linear-gradient(135deg,#080818,#001028)',
};

/* ─── utils ─── */
const $=id=>document.getElementById(id);
function html(id,s){const e=$(id);if(e)e.innerHTML=s}
function fmt(n,d=2){return n==null||isNaN(+n)?'—':(+n).toFixed(d)}
function sign(n,d=2){const v=+n;return isNaN(v)?'—':(v>=0?'+':'')+v.toFixed(d)}
function fmtK(n){const v=+n;if(isNaN(v))return '—';if(v>=1e9)return(v/1e9).toFixed(2)+'B';if(v>=1e6)return(v/1e6).toFixed(2)+'M';if(v>=1e3)return(v/1e3).toFixed(1)+'K';return v.toFixed(2)}
function dt(ts){if(!ts)return '—';return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function age(ts){const d=(Date.now()-new Date(ts))/1000;if(d<60)return Math.floor(d)+'s';if(d<3600)return Math.floor(d/60)+'m';if(d<86400)return Math.floor(d/3600)+'h';return Math.floor(d/86400)+'d'}
function pdp(v){if(!v)return 4;if(+v>=10000)return 1;if(+v>=100)return 2;return 4}
function maskEmail(e){if(!e)return '—';const[l,d]=e.split('@');const ext=d?d.slice(d.lastIndexOf('.')):'';return(l?.[0]||'*')+'***@***'+ext}

/* ─── splash ─── */
function setMsg(m){const e=$('sp-msg');if(e)e.textContent=m}

function ce(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e}
function dItem(page,label,sub=false){
  const b=ce('button','d-item'+(sub?' d-sub-item':''));
  b.textContent=label;b.dataset.page=page;
  b.onclick=()=>goPage(page);
  return b;
}
function dDiv(){return ce('div','d-div')}

function updateNavHL(){
  document.querySelectorAll('.d-item').forEach(e=>{
    e.classList.toggle('on',e.dataset.page===_activePage);
  });
}

/* ─── navigate ─── */
const PAGE_LABELS={
  overview:'Balance', news:'News', prices:'Prices',
  strategies:'Strategies', account:'Account', 'api-keys':'API Keys',
  security:'Security', settings:'Settings',
};
BOTS.forEach(b=>{PAGE_LABELS['bot-'+b.id]=b.label});

function goPage(id){
  _activePage=id;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

  // ensure bot page exists
  if(id.startsWith('bot-')&&!$('page-'+id)) createBotPage(id);

  const pg=$('page-'+id);
  if(pg){pg.classList.add('active');$('scroll').scrollTop=0}

  const lbl=PAGE_LABELS[id]||id;
  const hpg=$('hdr-page');
  if(hpg)hpg.textContent=lbl;

  updateNavHL();
  closeDrawer();

  if(id==='news')       loadNews();
  if(id==='prices')     loadPrices();
  if(id==='strategies') renderStrategies();
  if(id==='account')    renderAccount();
  if(id==='api-keys')   renderApiKeys();
  if(id==='security')   renderSecurity();
  if(id.startsWith('bot-')){
    _curBot=id.replace('bot-','');
    loadBotPage(id);
  }
}

/* ─── bot page ─── */
function createBotPage(pageId){
  const botId=pageId.replace('bot-','');
  const bot=BOTS.find(b=>b.id===botId)||{coins:['BTC','ETH','SOL']};
  const div=ce('div','page');
  div.id='page-'+pageId.replace('bot-','bot-');  // same as pageId
  div.innerHTML=`
    <div class="coin-pills" id="${pageId}-cps"></div>
    <div class="tf-pills"   id="${pageId}-tfs"></div>
    <div class="chart-box"  id="${pageId}-chart"><div class="chart-loading">Loading chart…</div></div>
    <div class="sl"><span class="sl-t">Live Trades</span><span class="sl-r" id="${pageId}-plbl">—</span></div>
    <div class="trades-box" id="${pageId}-trades"><div class="empty">Connecting…</div></div>
    <div class="sl" style="margin-top:16px"><span class="sl-t">Open Positions</span></div>
    <div id="${pageId}-pos"></div>
  `;
  $('scroll').appendChild(div);
}

function loadBotPage(pageId){
  const botId=pageId.replace('bot-','');
  const bot=BOTS.find(b=>b.id===botId)||{coins:['BTC','ETH','SOL']};
  const coins=bot.coins?.length?bot.coins:['BTC'];
  _curCoin=coins[0];

  /* coin pills */
  const cpsEl=$(pageId+'-cps');
  if(cpsEl){
    cpsEl.innerHTML='';
    coins.forEach((c,i)=>{
      const p=ce('button','c-pill'+(i===0?' on':''));
      p.textContent=c;
      p.onclick=()=>{
        cpsEl.querySelectorAll('.c-pill').forEach(x=>x.classList.remove('on'));
        p.classList.add('on');
        _curCoin=c;
        fetchChart(pageId,c,_curTf);
        connectTrades(pageId,c);
      };
      cpsEl.appendChild(p);
    });
  }

  /* TF pills */
  const tfsEl=$(pageId+'-tfs');
  if(tfsEl){
    tfsEl.innerHTML='';
    TFS.forEach(tf=>{
      const p=ce('button','tf-pill'+(tf.v===_curTf?' on':''));
      p.textContent=tf.l;
      p.onclick=()=>{
        tfsEl.querySelectorAll('.tf-pill').forEach(x=>x.classList.remove('on'));
        p.classList.add('on');
        _curTf=tf.v;
        fetchChart(pageId,_curCoin,tf.v);
      };
      tfsEl.appendChild(p);
    });
  }

  /* positions */
  renderBotPositions(pageId);

  /* load data */
  fetchChart(pageId,_curCoin,_curTf);
  connectTrades(pageId,_curCoin);
}

/* ─── candlestick chart ─── */
async function fetchChart(pageId,coin,tf){
  const box=$(pageId+'-chart');
  if(!box)return;
  box.innerHTML='<div class="chart-loading">Loading…</div>';
  try{
    const r=await fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=${coin}USDT&interval=${tf}&limit=80`);
    const j=await r.json();
    const raw=j?.result?.list||[];
    if(!raw.length){box.innerHTML='<div class="chart-loading">No data</div>';return}
    const candles=raw.reverse().map(x=>({t:+x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4],v:+x[5]}));
    box.innerHTML='';
    box.appendChild(buildChartSvg(candles,coin));
  }catch(e){
    box.innerHTML='<div class="chart-loading">Failed to load</div>';
  }
}

function buildChartSvg(candles,coin){
  const W=800,H=240,PL=56,PR=12,PT=20,PB=32;
  const cW=W-PL-PR,cH=H-PT-PB;
  const n=candles.length;
  const step=cW/n;
  const bw=Math.max(2,Math.floor(step)-1);
  const hi=Math.max(...candles.map(c=>c.h));
  const lo=Math.min(...candles.map(c=>c.l));
  const range=hi-lo||1;
  const yp=v=>PT+(1-(v-lo)/range)*cH;
  const maxV=Math.max(...candles.map(c=>c.v),1);
  const VH=32;
  const ticks=[lo,lo+range*.25,lo+range*.5,lo+range*.75,hi];

  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">`;
  s+=`<rect width="${W}" height="${H}" fill="#0a0a0a"/>`;

  // grid + y-labels
  ticks.forEach(v=>{
    const y=yp(v);
    s+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="rgba(128,128,128,.1)" stroke-width=".7" stroke-dasharray="3 4"/>`;
    const lbl=v>=10000?(v/1000).toFixed(1)+'k':v>=100?v.toFixed(0):v>=1?v.toFixed(2):v.toFixed(4);
    s+=`<text x="${PL-5}" y="${y+3.5}" text-anchor="end" font-family="Courier New,monospace" font-size="9" fill="#4a5568">${lbl}</text>`;
  });

  // candles + volume
  candles.forEach((c,i)=>{
    const x=PL+i*step+(step-bw)/2;
    const mx=PL+i*step+step/2;
    const up=c.c>=c.o;
    const col=up?'#00d4aa':'#ff4d6d';
    const bt=yp(Math.max(c.o,c.c));
    const bb=yp(Math.min(c.o,c.c));
    const bh=Math.max(bb-bt,1);
    s+=`<line x1="${mx}" y1="${yp(c.h)}" x2="${mx}" y2="${yp(c.l)}" stroke="${col}" stroke-width="1"/>`;
    s+=`<rect x="${x}" y="${bt}" width="${bw}" height="${bh}" fill="${col}"/>`;
    const vh=(c.v/maxV)*VH;
    s+=`<rect x="${x}" y="${H-PB-vh}" width="${bw}" height="${vh}" fill="${col}" opacity=".22"/>`;
  });

  // current price dashed line
  const last=candles[candles.length-1];
  const ly=yp(last.c);
  const lpr=last.c>=1000?last.c.toFixed(2):last.c>=1?last.c.toFixed(3):last.c.toFixed(5);
  s+=`<line x1="${PL}" y1="${ly}" x2="${W-PR}" y2="${ly}" stroke="#00d4aa" stroke-width=".8" stroke-dasharray="4 3" opacity=".6"/>`;
  s+=`<rect x="${W-PR-52}" y="${ly-9}" width="52" height="18" fill="rgba(0,212,170,.12)"/>`;
  s+=`<text x="${W-PR-4}" y="${ly+4.5}" text-anchor="end" font-family="Courier New,monospace" font-size="9" fill="#00d4aa">${lpr}</text>`;

  // coin label
  s+=`<text x="${PL+6}" y="${PT+13}" font-family="Courier New,monospace" font-size="11" font-weight="700" fill="#f0f2f5" letter-spacing="1">${coin}USDT</text>`;
  s+='</svg>';

  const d=document.createElement('div');
  d.innerHTML=s;
  return d.firstElementChild;
}

/* ─── live trades ws ─── */
function connectTrades(pageId,coin){
  if(_tradeWs){try{_tradeWs.close()}catch(e){}_tradeWs=null}
  const plbl=$(pageId+'-plbl');
  const box=$(pageId+'-trades');
  if(!box)return;
  box.innerHTML='<div class="empty">Connecting…</div>';
  let rows=[],pingId=null;

  const ws=new WebSocket('wss://stream.bybit.com/v5/public/linear');
  _tradeWs=ws;
  ws.onopen=()=>{
    ws.send(JSON.stringify({op:'subscribe',args:[`publicTrade.${coin}USDT`]}));
    pingId=setInterval(()=>{if(ws.readyState===1)ws.send('{"op":"ping"}')},18000);
  };
  ws.onmessage=e=>{
    try{
      const m=JSON.parse(e.data);
      if(m.topic&&m.data){
        rows=[...m.data.map(t=>({p:t.p,q:t.v,buy:t.S==='Buy'})),...rows].slice(0,60);
        if(plbl&&rows[0]){
          const v=+rows[0].p;
          plbl.textContent=v>=1000?v.toFixed(2):v>=1?v.toFixed(4):v.toFixed(6);
          plbl.style.color=rows[0].buy?'var(--g)':'var(--r)';
        }
        box.innerHTML=rows.map(r=>{
          const v=+r.p;
          const pStr=v>=1000?v.toFixed(2):v>=1?v.toFixed(4):v.toFixed(6);
          return `<div class="trade-row"><span style="font-family:var(--mono);font-size:10px;color:${r.buy?'var(--g)':'var(--r)'}">${pStr}</span><span style="font-family:var(--mono);font-size:10px;color:var(--fg3)">${(+r.q).toFixed(3)}</span></div>`;
        }).join('');
      }
    }catch(err){}
  };
  ws.onclose=()=>{if(pingId)clearInterval(pingId)};
  ws.onerror=()=>{};
}

/* ─── news ─── */
function categorize(src='',title='',desc=''){
  const s=src.toLowerCase(),tx=(title+' '+(desc||'')).toLowerCase();
  if(/whale[_ ]alert|lookonchain|smart wallet/.test(s))return 'ON-CHAIN';
  if(/oilprice|mining\.com|kitco/.test(s))return 'COMMODITIES';
  if(/marketwatch|yahoo finance|barrons/.test(s))return 'MARKETS';
  if(/al jazeera/.test(s))return 'GEOPOLITICS';
  if(/federal reserve/.test(s))return 'MACRO';
  if(/(binance|bybit).*(blog|announcement)/.test(s))return 'LISTINGS';
  if(/war |warfare|military|sanctions|nato|ukraine|russia|missile/.test(tx))return 'GEOPOLITICS';
  if(/inflation|recession|federal reserve| fed |interest rate| cpi | gdp /.test(tx))return 'MACRO';
  if(/crude oil|wti |brent|gold price|silver|per barrel|opec/.test(tx))return 'COMMODITIES';
  if(/stock market|s&p|nasdaq|dow jones|wall street|earnings/.test(tx))return 'MARKETS';
  if(/on-chain|whale|defi|smart contract|tvl|dex volume/.test(tx))return 'ON-CHAIN';
  if(/binance|bybit|coinbase|okx/.test(s))return 'LISTINGS';
  return 'CRYPTO';
}

async function loadNews(){
  if(_newsLoaded){renderNewsPage();return}
  html('news-list','<div class="empty">Loading…</div>');
  try{
    const r=await fetch('/api/news/public?limit=80');
    const j=await r.json();
    _newsAll=(j?.items||j?.articles||[]).map(a=>({...a,_cat:categorize(a.source||'',a.title||'',a.description||'')}));
    _newsLoaded=true;
    buildNewsCats();
    renderNewsPage();
  }catch(e){html('news-list','<div class="empty">Failed to load news</div>')}
}

function buildNewsCats(){
  html('news-cats',CAT_IDS.map(c=>`<button class="cat-pill${c===_newsCat?' on':''}" onclick="setNewsCat('${c}')">${c}</button>`).join(''));
}
function setNewsCat(c){_newsCat=c;buildNewsCats();renderNewsPage()}

function renderNewsPage(){
  const list=_newsCat==='ALL'?_newsAll:_newsAll.filter(a=>a._cat===_newsCat);
  if(!list.length){html('news-list','<div class="empty">No news in this category</div>');return}
  html('news-list',list.slice(0,40).map(a=>{
    const bg=CAT_BG[a._cat]||'var(--bg2)';
    const ts=a.published_at||a.publishedAt||a.date;
    const url=a.link||a.url||'';
    return`<div class="news-card" style="background:${bg}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
        <span class="news-cat">${a._cat}</span>
        ${ts?`<span style="font-family:var(--mono);font-size:9px;color:var(--fg3)">${age(ts)}</span>`:''}
      </div>
      <div class="news-title">${a.title||'—'}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <span class="news-source">${a.source||''}</span>
        ${url?`<a href="${url}" target="_blank" style="font-family:var(--mono);font-size:9px;color:var(--g);flex-shrink:0">↗ Open</a>`:''}
      </div>
      ${a.description?`<div class="news-desc">${a.description}</div>`:''}
    </div>`;
  }).join(''));
}

/* ─── prices ─── */
async function loadPrices(){
  html('prices-list','<div class="empty">Loading…</div>');
  try{
    const r=await fetch('https://api.bybit.com/v5/market/tickers?category=linear');
    const j=await r.json();
    const map={};
    (j?.result?.list||[]).forEach(t=>{
      const c=t.symbol.replace('USDT','');
      if(PRICE_COINS.includes(c))map[c]={p:+t.lastPrice,chg:+t.price24hPcnt*100,vol:+t.volume24h};
    });
    const ts=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    $('prices-ts').textContent='Updated '+ts;
    const rows=PRICE_COINS.filter(c=>map[c]).map(c=>{
      const d=map[c];
      const pos=d.chg>=0;
      const pStr=d.p>=1000?d.p.toFixed(2):d.p>=1?d.p.toFixed(4):d.p.toFixed(6);
      return`<div class="price-row">
        <span class="price-coin">${c}</span>
        <span class="price-val" style="color:${pos?'var(--g)':'var(--r)'}">${pStr}</span>
        <span class="price-chg" style="color:${pos?'var(--g)':'var(--r)'}">${pos?'+':''}${d.chg.toFixed(2)}%</span>
        <span class="price-vol">${fmtK(d.vol)}</span>
      </div>`;
    }).join('');
    html('prices-list',`<div style="border:1px solid var(--b)">
      <div class="price-hdr"><span>Coin</span><span style="text-align:right">Price</span><span style="text-align:right">24h</span><span style="text-align:right">Vol</span></div>
      ${rows}
    </div>`);
  }catch(e){html('prices-list','<div class="empty">Failed to load prices</div>')}
}

    <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:20px">
      <button id="pbtn" class="btn-p ${_paused?'btn-grn':'btn-red'}" onclick="togglePause()">${_paused?'▶ Resume Bot':'⏸ Pause Bot'}</button>
      <a href="https://kadoclub.net/dashboard" target="_blank" class="btn-p btn-inv" style="display:inline-flex;align-items:center;text-decoration:none">Dashboard ↗</a>
    </div>`;
}

/* ─── api keys ─── */
function renderApiKeys(){
  const el=$('keys-inner');
  if(!el)return;
  const connected=(_data?.positions?.length||0)>0||(_data?.balance?.usdt_wallet||0)>0;
  el.innerHTML=`
    <div class="acc-row">
      <span class="acc-lbl">Bybit</span>
      <span style="font-family:var(--mono);font-size:11px;color:${connected?'var(--g)':'var(--fg3)'}">${connected?'● Connected':'○ Not connected'}</span>
    </div>
    <div class="info-box" style="margin-top:12px">API key management (add/revoke/reveal) is only available on the full dashboard.</div>
    <a href="https://kadoclub.net/dashboard" target="_blank" class="btn-p btn-wht" style="display:inline-block;text-decoration:none;margin-top:4px">Manage API Keys →</a>`;
}

/* ─── security ─── */
function renderSecurity(){
  const el=$('sec-inner');
  if(!el)return;
  el.innerHTML=`
    <div class="acc-row"><span class="acc-lbl">2FA</span><span class="acc-val">TOTP authenticator</span></div>
    <div class="acc-row"><span class="acc-lbl">Password</span><span class="acc-val">•••••••••</span></div>
    <div class="info-box" style="margin-top:12px">2FA setup, password changes and active session management are only available on the full dashboard.</div>
    <a href="https://kadoclub.net/dashboard" target="_blank" class="btn-p btn-wht" style="display:inline-block;text-decoration:none;margin-top:4px">Open Security Settings →</a>`;
}

/* ─── pause ─── */
async function togglePause(){
  if(!_token)return;
  const btn=$('pbtn');
  if(btn)btn.disabled=true;
  try{
    const r=await fetch('/api/webapp/pause',{method:'POST',headers:{'Content-Type':'application/json','X-Webapp-Token':_token},body:JSON.stringify({pause:!_paused})});
    if(r.ok){
      _paused=!_paused;
      const dot=$('st-dot'),lbl=$('st-lbl');
      if(dot)dot.className='dot '+(_paused?'dot-off':'dot-on');
      if(lbl)lbl.textContent=_paused?'Paused':'Live';
      renderAccount();
    }
  }finally{if($('pbtn'))$('pbtn').disabled=false}
}

/* ─── init ─── */
async function init(){
  setMsg('Connecting…');
  try{
    const r=await fetch('/api/webapp/init',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg?.initData||''}),signal:AbortSignal.timeout(12000)});
    setMsg('Loading…');
    if(!r.ok){const e=await r.json().catch(()=>({}));showErr('Auth Failed',e.detail||'Status '+r.status);return}
    _data=await r.json();
    _token=_data.token||'';
    _paused=_data.paused||false;

    const dot=$('st-dot'),lbl=$('st-lbl');
    if(dot)dot.className='dot '+(_paused?'dot-off':'dot-on');
    if(lbl)lbl.textContent=_paused?'Paused':'Live';

    const u=_data.user||{};
    const du=$('d-user');
    if(du)du.textContent=u.username||u.email||'Account';

    buildNav();
    renderOverview(_data);

    $('splash').style.display='none';
    $('app').style.display='flex';
  }catch(e){showErr('Connection Error',e?.message||String(e))}
}

init();
</script>
</body>
</html>
