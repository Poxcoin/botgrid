<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KADO</title>
<script src="https://telegram.org/js/telegram-web-app.js" async></script>
<style>
/* ── design tokens (exact match index.css dark mode) ── */
:root {
  --bg:   #050505;
  --bg2:  #0a0a0a;
  --bg3:  #111111;
  --bg4:  #161616;
  --fg:   #f0f2f5;
  --fg2:  #8b95a8;
  --fg3:  #4a5568;
  --b:    rgba(255,255,255,0.06);
  --bhi:  rgba(255,255,255,0.08);
  --g:    #00d4aa;
  --gdim: rgba(0,212,170,0.12);
  --r:    #ff4d6d;
  --rdim: rgba(255,77,109,0.12);
  --mono: 'SF Mono','Courier New',monospace;
  --sans: -apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

button { font-family: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }

/* ── shell ── */
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-height: 100dvh;
  padding-top: env(safe-area-inset-top);
}

/* ── header ── */
.hdr {
  flex-shrink: 0;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--b);
  background: var(--bg);
}
.logo {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.32em;
  color: var(--fg);
}
.status {
  display: flex;
  align-items: center;
  gap: 7px;
}
.status-txt {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg3);
}
.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
}
.dot.on  { background: var(--g); box-shadow: 0 0 7px var(--g); }
.dot.off { background: var(--r); box-shadow: 0 0 7px var(--r); }

/* ── scrollable body ── */
.body {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* ── bottom nav ── */
.nav {
  flex-shrink: 0;
  display: flex;
  border-top: 1px solid var(--b);
  background: var(--bg);
  padding-bottom: env(safe-area-inset-bottom);
}
.nb {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  height: 54px;
  background: none;
  border: none;
  color: var(--fg3);
  transition: color 120ms;
  padding: 0;
}
.nb.on { color: var(--fg); }
.nb svg { width: 20px; height: 20px; flex-shrink: 0; }
.nb-lbl {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* ── screens ── */
.scr { display: none; }
.scr.on { display: block; }

/* ── section label (exact AnalyticsTab SectionLabel) ── */
.sl {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--b);
  padding-bottom: 10px;
  margin: 24px 0 16px;
}
.sl-t {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg3);
}
.sl-r {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--fg3);
}

/* ── stat cards (exact AnalyticsTab StatCard) ── */
.sc-row {
  display: flex;
  gap: 0;
  margin-bottom: 0;
}
.sc {
  flex: 1;
  min-width: 0;
  background: var(--bg);
  border: 1px solid var(--b);
  border-right: none;
  padding: 22px 18px;
  transition: background 200ms;
}
.sc:last-child { border-right: 1px solid var(--b); }
.sc-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg3);
  margin-bottom: 12px;
}
.sc-val {
  font-family: var(--mono);
  font-size: 24px;
  font-weight: 700;
  color: var(--fg);
  letter-spacing: -0.03em;
  line-height: 1.1;
}
.sc-sub {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--fg3);
  margin-top: 6px;
}

/* second row of stats */
.sc-row2 {
  display: flex;
  gap: 0;
  margin-bottom: 24px;
}
.sc-row2 .sc {
  border-top: none;
}

/* ── chart card ── */
.chart-card {
  border: 1px solid var(--b);
  background: var(--bg);
  padding: 16px;
  margin-bottom: 0;
}
.chart-header {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 10px;
}
.chart-sym  { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--fg); }
.chart-px   { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--fg); }
.chart-chg  { font-family: var(--mono); font-size: 10px; }
.chart-wrap { display: flex; gap: 12px; }
.chart-item { flex: 1; min-width: 0; }
.chart-div  { width: 1px; background: var(--b); flex-shrink: 0; }

/* ── table (exact AnalyticsTab DataTable + BotTab PositionsTable) ── */
.tbl-outer { overflow-x: auto; margin-bottom: 0; }
table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--mono);
  font-size: 11px;
  min-width: 460px;
}
thead tr { border-bottom: 1px solid var(--b); }
th {
  padding: 6px 12px;
  text-align: right;
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg3);
  font-weight: 400;
  white-space: nowrap;
}
th.tl { text-align: left; }
td {
  padding: 10px 12px;
  text-align: right;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  color: var(--fg2);
  white-space: nowrap;
}
td.tl { text-align: left; }
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--bg3); }

/* ── trade row (AnalyticsTab TradeRow style) ── */
.tr-list { margin-bottom: 0; }
.tr-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-bottom: 1px solid var(--b);
}
.tr-row:last-child { border-bottom: none; }
.tr-left { display: flex; flex-direction: column; gap: 3px; }
.tr-coin {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--fg);
}
.tr-meta {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--fg3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.tr-pnl {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
}

/* ── badges ── */
.bdg {
  display: inline-block;
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.12em;
  padding: 2px 7px;
  border: 1px solid;
  text-transform: uppercase;
}
.bl { color: var(--g); border-color: rgba(0,212,170,0.30); background: var(--gdim); }
.bs { color: var(--r); border-color: rgba(255,77,109,0.30); background: var(--rdim); }
.bw { color: var(--g); border-color: rgba(0,212,170,0.30); background: var(--gdim); }
.bx { color: var(--r); border-color: rgba(255,77,109,0.30); background: var(--rdim); }
.bp { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: 0.12em; padding: 3px 10px; border: 1px solid; text-transform: uppercase; display: inline-block; }
.bp-pro  { color: var(--g); border-color: rgba(0,212,170,0.35); background: var(--gdim); }
.bp-perf { color: #f59e0b; border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.1); }
.bp-trial{ color: var(--fg3); border-color: var(--b); }

/* ── account rows ── */
.ac-section {
  border: 1px solid var(--b);
  margin-bottom: 20px;
}
.ac-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--b);
}
.ac-row:last-child { border-bottom: none; }
.ac-lbl {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--fg3);
  margin-bottom: 4px;
}
.ac-val {
  font-size: 13px;
  color: var(--fg);
}

/* ── pause button ── */
.pause-wrap { padding: 0 0 20px; }
#pbtn {
  width: 100%;
  padding: 13px;
  border: 1px solid;
  background: none;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-weight: 700;
  transition: opacity 120ms;
}
#pbtn:disabled { opacity: 0.4; cursor: not-allowed; }
.brun { color: var(--r); border-color: rgba(255,77,109,0.30); background: var(--rdim) !important; }
.bpsd { color: var(--g); border-color: rgba(0,212,170,0.30); background: var(--gdim) !important; }

/* ── screen padding ── */
.pad { padding: 0 20px 24px; }

/* ── divider ── */
.div { height: 1px; background: var(--b); margin: 20px 0; }

/* ── empty ── */
.empty {
  padding: 36px 20px;
  text-align: center;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--fg3);
}

/* ── splash ── */
#splash {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 999;
}
.spin {
  width: 24px; height: 24px;
  border: 1.5px solid var(--bhi);
  border-top-color: var(--fg);
  border-radius: 50%;
  animation: sp 0.75s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }
.splash-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg3);
}
.err-wrap {
  max-width: 290px;
  width: 100%;
  border: 1px solid var(--bhi);
  background: var(--bg2);
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
}
.err-tag   { font-family: var(--mono); font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--r); border: 1px solid rgba(255,77,109,0.25); background: var(--rdim); padding: 3px 10px; }
.err-title { font-size: 14px; font-weight: 600; line-height: 1.4; }
.err-body  { font-family: var(--mono); font-size: 10px; color: var(--fg2); line-height: 1.6; }
</style>
</head>
<body>

<div id="splash">
  <div class="spin"></div>
  <div class="splash-label" id="splash-msg">Initializing…</div>
</div>

<div id="app" style="display:none">

  <div class="hdr">
    <div class="logo">KADO</div>
    <div class="status">
      <span class="status-txt" id="st-lbl">Live</span>
      <div class="dot on" id="st-dot"></div>
    </div>
  </div>

  <div class="body" id="body">

    <!-- ── OVERVIEW ── -->
    <div class="scr on" id="s-overview">
      <div class="pad">
        <!-- 4 stat cards in 2×2 -->
        <div style="margin-top:20px">
          <div class="sc-row" id="sc-row1"></div>
          <div class="sc-row2" id="sc-row2"></div>
        </div>

        <!-- price charts -->
        <div class="sl" style="margin-top:0">
          <span class="sl-t">Market</span>
          <span class="sl-r" id="chart-ts"></span>
        </div>
        <div class="chart-wrap" id="chart-wrap" style="margin-bottom:24px"></div>

        <!-- positions preview -->
        <div class="sl">
          <span class="sl-t">Open Positions</span>
          <span class="sl-r" id="ov-pos-cnt">0</span>
        </div>
        <div class="tbl-outer" id="ov-pos-tbl"></div>
      </div>
    </div>

    <!-- ── POSITIONS ── -->
    <div class="scr" id="s-positions">
      <div class="pad">
        <div class="sl" style="margin-top:20px">
          <span class="sl-t">Open Positions</span>
          <span class="sl-r" id="pos-cnt">0</span>
        </div>
        <div class="tbl-outer" id="pos-tbl"></div>
      </div>
    </div>

    <!-- ── SIGNALS ── -->
    <div class="scr" id="s-signals">
      <div class="pad">
        <div class="sl" style="margin-top:20px">
          <span class="sl-t">Recent Signals</span>
          <span class="sl-r" id="sig-cnt">0</span>
        </div>
        <div id="sig-list" class="tr-list" style="border:1px solid var(--b)"></div>
      </div>
    </div>

    <!-- ── ACCOUNT ── -->
    <div class="scr" id="s-account">
      <div class="pad">
        <div class="sl" style="margin-top:20px">
          <span class="sl-t">Account</span>
        </div>
        <div class="ac-section" id="ac-info"></div>
        <div class="div"></div>
        <div class="pause-wrap" id="pause-wrap"></div>
      </div>
    </div>

  </div>

  <!-- bottom nav -->
  <nav class="nav">
    <button class="nb on" data-t="overview" onclick="go('overview')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
      </svg>
      <span class="nb-lbl">Overview</span>
    </button>
    <button class="nb" data-t="positions" onclick="go('positions')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6"  y1="20" x2="6"  y2="14"/>
      </svg>
      <span class="nb-lbl">Positions</span>
    </button>
    <button class="nb" data-t="signals" onclick="go('signals')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
      <span class="nb-lbl">Signals</span>
    </button>
    <button class="nb" data-t="account" onclick="go('account')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
      </svg>
      <span class="nb-lbl">Account</span>
    </button>
  </nav>

</div>

<script>
'use strict';
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let _token = null, _paused = false;

/* ── utils ── */
const $  = id => document.getElementById(id);
const mk = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const nd = (tag, cls, t) => { const e = mk(tag, cls); e.textContent = t; return e; };
const setMsg = m => { const e = $('splash-msg'); if (e) e.textContent = m; };

function fmt(n, d = 2) { return Number(n ?? 0).toFixed(d); }
function fmtP(v) {
  const n = +v;
  if (!n) return '—';
  return n >= 10000 ? n.toFixed(0) : n >= 1000 ? n.toFixed(1) : n >= 100 ? n.toFixed(2) : n.toFixed(4);
}
function sign(n) { return +n >= 0 ? '+' : ''; }
function ago(ts) {
  if (!ts) return '—';
  const m = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm';
  if (m < 1440) return Math.floor(m / 60) + 'h';
  return Math.floor(m / 1440) + 'd';
}

/* ── nav ── */
function go(name) {
  document.querySelectorAll('.nb').forEach(b => b.classList.toggle('on', b.dataset.t === name));
  document.querySelectorAll('.scr').forEach(s => s.classList.toggle('on', s.id === 's-' + name));
  $('body').scrollTop = 0;
}

/* ── stat card ── */
function mkSC(label, value, sub, color) {
  const c = mk('div', 'sc');
  const l = nd('div', 'sc-label', label);
  const v = nd('div', 'sc-val', value);
  if (color) v.style.color = color;
  c.appendChild(l); c.appendChild(v);
  if (sub) c.appendChild(nd('div', 'sc-sub', sub));
  return c;
}

/* ── sparkline ── */
function sparkline(candles, W, H) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.style.cssText = 'display:block;width:100%;height:auto';
  if (!candles.length) return svg;
  const maxH = Math.max(...candles.map(c => c.h));
  const minL = Math.min(...candles.map(c => c.l));
  const range = maxH - minL || maxH * 0.001;
  const n = candles.length, cw = W / n;
  const sy = v => ((maxH - v) / range) * H;
  candles.forEach((c, i) => {
    const up  = c.c >= c.o;
    const col = up ? '#00d4aa' : '#ff4d6d';
    const cx  = i * cw + cw / 2;
    const top = sy(Math.max(c.o, c.c));
    const bh  = Math.max(1, sy(Math.min(c.o, c.c)) - top);
    const wk  = document.createElementNS(ns, 'line');
    wk.setAttribute('x1', cx); wk.setAttribute('y1', sy(c.h));
    wk.setAttribute('x2', cx); wk.setAttribute('y2', sy(c.l));
    wk.setAttribute('stroke', col); wk.setAttribute('stroke-width', '0.8'); wk.setAttribute('opacity', '0.4');
    const bd  = document.createElementNS(ns, 'rect');
    bd.setAttribute('x', Math.max(0, cx - cw * 0.4));
    bd.setAttribute('y', top);
    bd.setAttribute('width', Math.max(1, cw * 0.8));
    bd.setAttribute('height', bh);
    bd.setAttribute('fill', col); bd.setAttribute('opacity', '0.9');
    svg.appendChild(wk); svg.appendChild(bd);
  });
  return svg;
}

/* ── fetch klines ── */
async function fetchKlines(sym) {
  const r = await fetch(
    `https://api.bybit.com/v5/market/kline?category=linear&symbol=${sym}USDT&interval=60&limit=48`
  );
  const d = await r.json();
  return (d?.result?.list || []).slice().reverse().map(k => ({
    o: +k[1], h: +k[2], l: +k[3], c: +k[4],
  }));
}

/* ── build chart item ── */
async function buildChartItem(sym) {
  const wrap = mk('div', 'chart-item');
  const hdr  = mk('div', 'chart-header');
  const symEl   = nd('span', 'chart-sym', sym);
  const priceEl = nd('span', 'chart-px', '—');
  const chgEl   = nd('span', 'chart-chg', '');
  hdr.appendChild(symEl); hdr.appendChild(priceEl); hdr.appendChild(chgEl);
  wrap.appendChild(hdr);
  try {
    const candles = await fetchKlines(sym);
    if (candles.length) {
      const last = candles[candles.length - 1];
      const chgPct = ((last.c - candles[0].o) / candles[0].o) * 100;
      priceEl.textContent = '$' + fmtP(last.c);
      chgEl.textContent   = sign(chgPct) + chgPct.toFixed(2) + '%';
      chgEl.style.color   = chgPct >= 0 ? 'var(--g)' : 'var(--r)';
      wrap.appendChild(sparkline(candles, 160, 44));
    }
  } catch (_) {}
  return wrap;
}

/* ── build charts ── */
async function buildCharts() {
  const wrap = $('chart-wrap');
  wrap.textContent = '';
  const [btc, eth] = await Promise.all([buildChartItem('BTC'), buildChartItem('ETH')]);
  const div = mk('div', 'chart-div');
  wrap.appendChild(btc); wrap.appendChild(div); wrap.appendChild(eth);
  $('chart-ts').textContent = '48h · 1h';
}

/* ── positions table ── */
function posTable(positions) {
  if (!positions?.length) return nd('div', 'empty', 'No open positions');
  const outer = mk('div', 'tbl-outer');
  const tbl   = mk('table');
  const thead = mk('thead');
  const tr0   = mk('tr');
  ['Symbol', 'Side', 'Lev', 'Entry', 'Mark', 'uPnL', 'ROE%'].forEach((h, i) => {
    const th = nd('th', i === 0 ? 'tl' : '', h);
    tr0.appendChild(th);
  });
  thead.appendChild(tr0);
  tbl.appendChild(thead);
  const tbody = mk('tbody');
  positions.forEach(p => {
    const pnl = +(p.unrealized_pnl ?? 0);
    const isP = pnl >= 0;
    const pc  = isP ? 'var(--g)' : 'var(--r)';
    const sc  = p.side === 'LONG' ? 'var(--g)' : 'var(--r)';
    const row = mk('tr');
    const cells = [
      { t: p.symbol,                                  s: { textAlign:'left', color:'var(--fg)', fontWeight:'600' } },
      { t: p.side,                                    s: { color: sc, fontWeight: '600' } },
      { t: (p.leverage ?? '—') + '×',                s: { color: 'var(--fg3)' } },
      { t: fmtP(p.entry_price),                       s: { color: 'var(--fg2)' } },
      { t: fmtP(p.mark_price),                        s: { color: 'var(--fg2)' } },
      { t: sign(pnl) + fmt(pnl),                      s: { color: pc, fontWeight: '700' } },
      { t: sign(p.pnl_pct) + fmt(p.pnl_pct) + '%',   s: { color: pc } },
    ];
    cells.forEach(({ t, s }) => {
      const td = nd('td', '', t);
      Object.assign(td.style, s);
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  tbl.appendChild(tbody);
  outer.appendChild(tbl);
  return outer;
}

/* ── signal row ── */
function sigRow(s) {
  const row  = mk('div', 'tr-row');
  const left = mk('div', 'tr-left');
  const coin = nd('span', 'tr-coin', s.coin || '—');
  const meta = mk('span', 'tr-meta');
  const bdg  = nd('span', 'bdg ' + (s.action === 'LONG' ? 'bl' : 'bs'), s.action || '—');
  meta.appendChild(bdg);
  if (s.result) {
    const rb = nd('span', 'bdg ' + (s.result === 'WIN' ? 'bw' : 'bx'), s.result);
    rb.style.marginLeft = '6px';
    meta.appendChild(rb);
  }
  left.appendChild(coin); left.appendChild(meta);
  const t = nd('span', 'tr-meta', ago(s.timestamp));
  t.style.flexShrink = '0';
  row.appendChild(left); row.appendChild(t);
  return row;
}

/* ── render overview ── */
function renderOverview(data) {
  const b    = data.balance || {};
  const upnl = +(b.unrealized_pnl ?? 0);
  const pos  = data.positions || [];

  const r1 = $('sc-row1'), r2 = $('sc-row2');
  r1.textContent = ''; r2.textContent = '';
  r1.appendChild(mkSC('Balance',        '$' + fmt(b.usdt_wallet), 'USDT'));
  r1.appendChild(mkSC('Unrealized PnL', sign(upnl) + fmt(upnl),  'USDT',
    upnl > 0 ? 'var(--g)' : upnl < 0 ? 'var(--r)' : null));
  r2.appendChild(mkSC('Equity',         '$' + fmt(b.usdt_equity), 'USDT'));
  r2.appendChild(mkSC('Available',      '$' + fmt(b.usdt_free),   'USDT'));

  $('ov-pos-cnt').textContent = String(pos.length);
  const tblEl = $('ov-pos-tbl');
  tblEl.textContent = '';
  tblEl.appendChild(posTable(pos.slice(0, 5)));

  buildCharts();
}

/* ── render positions ── */
function renderPositions(positions) {
  $('pos-cnt').textContent = String((positions || []).length);
  const el = $('pos-tbl');
  el.textContent = '';
  el.appendChild(posTable(positions));
}

/* ── render signals ── */
function renderSignals(signals) {
  const list = (signals || []).slice(0, 30);
  $('sig-cnt').textContent = String(list.length);
  const el = $('sig-list');
  el.textContent = '';
  if (!list.length) { el.appendChild(nd('div', 'empty', 'No signals yet')); return; }
  list.forEach(s => el.appendChild(sigRow(s)));
}

/* ── render account ── */
function renderAccount(data) {
  const u   = data.user || {};
  const pc  = u.plan === 'pro' ? 'plan-pro' : u.plan === 'performance' ? 'plan-perf' : 'plan-trial';
  const planLabel = (u.plan || 'trial').toUpperCase();

  const info = $('ac-info');
  info.textContent = '';

  [
    { label: 'Email',    value: u.email    || '—',  isText: true },
    { label: 'Username', value: u.username || '—',  isText: true },
    { label: 'Plan',     value: planLabel,           isBadge: true, badgeCls: pc },
  ].forEach(({ label, value, isText, isBadge, badgeCls }) => {
    const row  = mk('div', 'ac-row');
    const left = mk('div');
    left.appendChild(nd('div', 'ac-lbl', label));
    if (isBadge) {
      left.appendChild(nd('span', 'bp bp-' + badgeCls.replace('plan-', ''), value));
    } else {
      left.appendChild(nd('div', 'ac-val', value));
    }
    row.appendChild(left);
    info.appendChild(row);
  });

  /* pause button */
  const wrap = $('pause-wrap');
  wrap.textContent = '';
  const btn  = mk('button');
  btn.id = 'pbtn';
  btn.className = _paused ? 'bpsd' : 'brun';
  btn.textContent = _paused ? '▶  Resume Bot' : '⏸  Pause Bot';
  btn.onclick = togglePause;
  wrap.appendChild(btn);
}

/* ── main render ── */
function render(data) {
  _paused = data.paused;

  const lbl = $('st-lbl'), dot = $('st-dot');
  if (lbl) lbl.textContent = _paused ? 'Paused' : 'Live';
  if (dot) dot.className   = 'dot ' + (_paused ? 'off' : 'on');

  renderOverview(data);
  renderPositions(data.positions);
  renderSignals(data.signals);
  renderAccount(data);

  $('splash').style.display = 'none';
  $('app').style.display    = 'flex';
}

/* ── error ── */
function showError(msg) {
  const m  = String(msg || '');
  const isBybit = /bybit|api key|not configured|keys/i.test(m);
  const isAuth  = /auth|401|403|token|unauthorized/i.test(m);
  const isTime  = /timeout|abort|timed out/i.test(m);
  const title   = isBybit ? 'API keys not connected'
                : isAuth  ? 'Authentication failed'
                : isTime  ? 'Connection timeout'
                : 'Something went wrong';
  const body    = isBybit ? 'Connect Bybit API keys in the dashboard Settings.'
                : isAuth  ? 'Open this app through the Telegram bot @KADO_c_BOT.'
                : isTime  ? 'Server is slow. Please try again.'
                : m || 'Unexpected error.';
  const splash  = $('splash');
  splash.textContent = '';
  splash.style.display = 'flex';
  const wrap = mk('div', 'err-wrap');
  wrap.appendChild(nd('div', 'err-tag', 'Error'));
  wrap.appendChild(nd('div', 'err-title', title));
  wrap.appendChild(nd('div', 'err-body', body));
  splash.appendChild(wrap);
}

/* ── pause ── */
async function togglePause() {
  if (!_token) return;
  const btn = $('pbtn');
  if (btn) btn.disabled = true;
  try {
    const res = await fetch('/api/webapp/pause', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Webapp-Token': _token },
      body: JSON.stringify({ pause: !_paused }),
    });
    if (res.ok) {
      _paused = !_paused;
      const lbl = $('st-lbl'), dot = $('st-dot');
      if (lbl) lbl.textContent = _paused ? 'Paused' : 'Live';
      if (dot) dot.className   = 'dot ' + (_paused ? 'off' : 'on');
      if (btn) { btn.className = _paused ? 'bpsd' : 'brun'; btn.textContent = _paused ? '▶  Resume Bot' : '⏸  Pause Bot'; }
    }
  } finally {
    if (btn) btn.disabled = false;
  }
}

/* ── init ── */
async function init() {
  setMsg('Connecting…');
  try {
    const res = await fetch('/api/webapp/init', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ init_data: tg?.initData || '' }),
      signal: AbortSignal.timeout(12000),
    });
    setMsg('Loading…');
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      showError(e.detail || 'Auth failed (' + res.status + ')');
      return;
    }
    render(await res.json());
  } catch (e) {
    showError(e?.message || String(e));
  }
}
init();
</script>
</body>
</html>
